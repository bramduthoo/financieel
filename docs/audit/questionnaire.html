:["(a) All working — keep them.","(b) Drop one specifically.","(c) Add a gate, which I will name."],"recommendation":"(a). The one I would reinforce rather than add is `verify-merge` — it is already mandated and it is the easiest to skip precisely when a merge 'looked clean', which is when it has historically mattered most.","skip":""},{"id":"Q-122","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Decision files","priority":"SHOULD","context":"This operation used numbered decision blocks plus a self-contained offline HTML review interface with a JSON export loop. Four such files were produced (cleanup, structure, docs, and this questionnaire), and every previous one came back fully decided.","question":"Is that the right mechanism for future work, or was it overhead justified only by the audit's size?","why":"It is a real cost to produce, and it is only worth repeating if the format made the decisions easier rather than merely prettier. You are the only person who can say which.","options":["(a) Yes — use it for any multi-item decision.","(b) Only for things with more than roughly fifteen items.","(c) Plain markdown decision blocks are enough.","(d) Neither — decide in conversation."],"recommendation":"(b). Below about fifteen items a conversation is faster than building an interface, and the interface's real value showed up at 21 and 22 items, not at 1 (the structure review's single block would have been quicker as a sentence).","skip":""},{"id":"Q-123","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Plan mode","priority":"NICE","context":"`CLAUDE.md` mandates plan mode first for any feature or refactor, with the plan approved before code is written.","question":"Does that still hold for small changes, and where is the line?","why":"Several A-list items are five to twenty line fixes (Q-037, Q-016, Q-029). Plan mode on a four-class Tailwind fix is friction with no benefit, and friction with no benefit is how good rules get quietly abandoned.","options":["(a) Plan mode for anything touching `src/lib/`, pages, or schema; direct for docs, styling and config.","(b) Plan mode always, as now.","(c) Plan mode for anything over N files."],"recommendation":"(a). It is the same directory-based line as Q-117, which makes both rules easy to remember and easy to state in one sentence of `CLAUDE.md`.","skip":""},{"id":"Q-124","part":"B","section":"B9","sectionTitle":"Constraints","topic":"Time","priority":"MUST","context":"`main` received no commits between 2026-07-30 and the start of this audit — five weeks — while the most recent feature work sat on an unpushed local branch. The project has been running since December 2025 and has 86 commits and 18 merged PRs.","question":"How much time do you realistically have for this, per week?","why":"It is the difference between 'encryption is a phase' and 'encryption is a year'. Every priority recommendation in this file implicitly assumes a rate; without one, the *order* of the roadmap matters far more than its contents.","options":["(a) A few hours a month.","(b) A few hours a week.","(c) Substantial blocks when I have them, nothing in between."],"recommendation":"No recommendation — but if (a) or (c), cut hard in Q-077. A long list at a low rate is exactly how a project stalls, and this one has already had one five-week gap.","skip":""},{"id":"Q-125","part":"B","section":"B9","sectionTitle":"Constraints","topic":"Budget","priority":"SHOULD","context":"Current costs: Supabase free tier, Vercel, Resend for verification email, and Claude usage. §6.3 notes a $20 Claude API credit was once available for the AI-entry idea.","question":"Is there a budget, and does anything on the roadmap depend on spending money?","why":"Two answers above touch it — the Supabase tier (Q-106) and error reporting (Q-056 (b)). Both are free at this scale, so the honest answer may simply be 'nothing depends on it'.","options":["(a) Zero budget — everything must stay free.","(b) A small budget is available.","(c) Not a constraint."],"recommendation":"(a) is entirely achievable for everything recommended in this questionnaire. Nothing I recommend requires a paid service.","skip":""},{"id":"Q-126","part":"B","section":"B9","sectionTitle":"Constraints","topic":"Deadlines","priority":"SHOULD","context":"Nothing in the repo suggests an external deadline. The only genuinely time-sensitive item the audit found is Q-011: the fingerprint index decision is cheapest before the first real import (Q-010), not after.","question":"Is there a deadline or an external event that constrains sequencing?","why":"If there is no deadline, sequencing should follow risk — money paths first. If there is one, it should follow the deadline, and several recommendations would reorder.","options":["(a) No deadline.","(b) Yes — I will name it."],"recommendation":"None.","skip":""},{"id":"Q-127","part":"B","section":"B9","sectionTitle":"Constraints","topic":"What happens next","priority":"SHOULD","context":"The remaining work splits fairly cleanly into decisions that need a conversation (dashboard content, encryption scope, visual direction) and execution that does not (the atomicity RPCs, tests, the small fixes). `PHASE-ROADMAP.md` already encodes this split as CHAT-FIRST versus CODE-FIRST.","question":"Does that split still match how you want to work, and which remaining items do you want to talk through before anything is built?","why":"It decides what happens immediately after this questionnaire is answered — a build session, or a design conversation.","options":["(a) The split is right; the chat-first items are dashboard content and encryption scope.","(b) I want to talk through more than that.","(c) Skip the conversations — just plan and build."],"recommendation":"(a). Of everything remaining, only the dashboard's content (Q-086) and the encryption scope (Q-072) genuinely need a conversation; the rest is decided by the answers in this file.","skip":""}],"sections":[{"key":"A1","title":"Unexplained code","part":"A","ids":["Q-001","Q-002","Q-003","Q-004","Q-005","Q-006","Q-007"]},{"key":"A2","title":"Half-built and abandoned","part":"A","ids":["Q-008","Q-009","Q-010","Q-011","Q-012","Q-013","Q-014","Q-015","Q-016","Q-017"]},{"key":"A3","title":"Internal inconsistency","part":"A","ids":["Q-018","Q-019","Q-020","Q-021","Q-022","Q-023","Q-024","Q-025"]},{"key":"A4","title":"Known issues — confirm and prioritise","part":"A","ids":["Q-026","Q-027","Q-028","Q-029","Q-030","Q-031","Q-032","Q-033","Q-034","Q-035","Q-036"]},{"key":"A5","title":"Rule violations","part":"A","ids":["Q-037","Q-038","Q-039","Q-040","Q-041"]},{"key":"A6","title":"Test coverage","part":"A","ids":["Q-042","Q-043","Q-044","Q-045","Q-046","Q-047","Q-048"]},{"key":"A7","title":"My suggestions","part":"A","ids":["Q-049","Q-050","Q-051","Q-052","Q-053","Q-054","Q-055","Q-056"]},{"key":"A8","title":"Data and schema","part":"A","ids":["Q-057","Q-058","Q-059","Q-060","Q-061","Q-062","Q-063","Q-064"]},{"key":"B1","title":"Definition of done","part":"B","ids":["Q-065","Q-066","Q-067","Q-068","Q-069"]},{"key":"B2","title":"Remaining scope","part":"B","ids":["Q-070","Q-071","Q-072","Q-073","Q-074","Q-075","Q-076","Q-077","Q-078","Q-079","Q-080"]},{"key":"B3","title":"Feature behaviour","part":"B","ids":["Q-081","Q-082","Q-083","Q-084","Q-085","Q-086","Q-087","Q-088","Q-089","Q-090","Q-091"]},{"key":"B4","title":"Visual direction and layout","part":"B","ids":["Q-092","Q-093","Q-094","Q-095","Q-096","Q-097","Q-098","Q-099","Q-100"]},{"key":"B5","title":"Platform and reach","part":"B","ids":["Q-101","Q-102","Q-103","Q-104","Q-105","Q-106"]},{"key":"B6","title":"Data, privacy and trust","part":"B","ids":["Q-107","Q-108","Q-109","Q-110","Q-111","Q-112","Q-113"]},{"key":"B7","title":"Collaboration","part":"B","ids":["Q-114","Q-115","Q-116"]},{"key":"B8","title":"Working style and autonomy","part":"B","ids":["Q-117","Q-118","Q-119","Q-120","Q-121","Q-122","Q-123"]}, const KEY = 'financieel-audit-questionnaire-v1';
const DOC = 'questionnaire';

/* ── state ─────────────────────────────────────────────────────── */
let state = { answers: {}, savedAt: null };
let dirtySinceExport = false;
let focusIdx = 0;
let filters = { un:false, must:false, start:false, think:false, showSkipped:true, q:'' };

const startIds = new Set(DATA.startHere.map(s => s.id));
const byId = Object.fromEntries(DATA.questions.map(q => [q.id, q]));

function ans(id){
  if(!state.answers[id]) state.answers[id] = { options:[], answer:'', needsThought:false };
  return state.answers[id];
}
function hasAnswer(id){
  const a = state.answers[id];
  return !!a && ((a.options && a.options.length) || (a.answer && a.answer.trim()));
}
function optLetters(q){
  return q.options.map(o => { const m = /^\(([a-z])\)\s/.exec(o); return m ? m[1] : null; });
}
function isFreeform(q){ return optLetters(q).every(l => l === null); }

/* auto-skip: a target is skipped when its source answer matches */
function skipInfo(id){
  for(const c of DATA.conditions){
    if(c.target !== id) continue;
    const a = state.answers[c.source];
    if(!a || !a.options || !a.options.length) continue;
    if(c.whenAny && c.whenAny.some(l => a.options.includes(l))) return c;
    if(c.whenNoneOf && !c.whenNoneOf.some(l => a.options.includes(l))) return c;
  }
  return null;
}

/* ── persistence ───────────────────────────────────────────────── */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    state.savedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    dirtySinceExport = true;
    paintSaved();
  }, 250);
}
function paintSaved(){
  const el = document.getElementById('saved');
  if(!state.savedAt){ el.textContent = 'not saved yet'; el.className = 'saved'; return; }
  const d = new Date(state.savedAt);
  const t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  el.textContent = (dirtySinceExport ? 'saved ' : 'exported · saved ') + t;
  el.className = 'saved' + (dirtySinceExport ? ' dirty' : '');
}
function restore(){
  try {
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.answers){ state = s; dirtySinceExport = true; } }
  } catch(e){}
}

/* ── tiny inline markdown ──────────────────────────────────────── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,c) => '<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
}

/* ── render ────────────────────────────────────────────────────── */
function visible(q){
  if(filters.must && q.priority !== 'MUST') return false;
  if(filters.start && !startIds.has(q.id)) return false;
  if(filters.think && !(state.answers[q.id] && state.answers[q.id].needsThought)) return false;
  if(filters.un && hasAnswer(q.id)) return false;
  if(!filters.showSkipped && skipInfo(q.id)) return false;
  if(filters.q){
    const hay = (q.id+' '+q.topic+' '+q.section+' '+q.sectionTitle+' '+q.context+' '+q.question+' '+q.why+' '+q.recommendation+' '+q.options.join(' ')).toLowerCase();
    if(!hay.includes(filters.q)) return false;
  }
  return true;
}
function visibleList(){ return DATA.questions.filter(visible); }

function renderIntro(){
  const c = DATA.counts;
  let h = '<div class="panel"><h3>How to read this</h3>'
    + '<p>Every answer is optional and this file can be returned half-finished. Nothing treats silence as consent. Your work autosaves in this browser as you go &mdash; press <strong>Export JSON</strong> whenever you want to hand it back, including partway through.</p>'
    + '<p><strong>Part A</strong> comes from the code: mostly &ldquo;confirm or correct my reading&rdquo;, which is faster than it looks. <strong>Part B</strong> comes to you: scope, behaviour, visual direction, and what &ldquo;done&rdquo; means.</p>'
    + '<table class="counts"><tr><th>Part</th><th class="n">Questions</th><th class="n">MUST</th><th class="n">SHOULD</th><th class="n">NICE</th></tr>';
  for(const p of ['A','B']){
    const qs = DATA.questions.filter(q => q.part === p);
    h += '<tr><td>Part '+p+'</td><td class="n">'+qs.length+'</td><td class="n">'+qs.filter(q=>q.priority==='MUST').length+'</td><td class="n">'+qs.filter(q=>q.priority==='SHOULD').length+'</td><td class="n">'+qs.filter(q=>q.priority==='NICE').length+'</td></tr>';
  }
  h += '<tr><td><strong>Total</strong></td><td class="n"><strong>'+c.total+'</strong></td><td class="n"><strong>'+c.MUST+'</strong></td><td class="n"><strong>'+c.SHOULD+'</strong></td><td class="n"><strong>'+c.NICE+'</strong></td></tr></table></div>';

  h += '<div class="panel"><h3>Start here &mdash; the ten that unblock the most</h3><ol>';
  for(const s of DATA.startHere){
    const q = byId[s.id];
    h += '<li><button class="jump" data-jump="'+s.id+'">'+s.id+'</button> &middot; '+esc(q.topic)+' &mdash; '+md(s.why)+'</li>';
  }
  h += '</ol></div>';

  h += '<div class="panel warn"><h3>The one finding I would act on first</h3><p>'+md(DATA.urgent.text)+'</p>'
     + '<p><button class="jump" data-jump="'+DATA.urgent.id+'">Jump to '+DATA.urgent.id+'</button></p></div>';

  document.getElementById('intro').innerHTML = h;
}

function renderClosing(){
  let h = '<div class="hairline"></div><div class="panel"><h3>Reminder</h3>'
    + '<p>Export before you close the tab. The browser keeps your answers locally, but the JSON file is what the next session reads. Partial exports are valid &mdash; unanswered questions are simply absent from the file.</p></div>';
  document.getElementById('closing').innerHTML = h;
}

function renderList(){
  const vis = visibleList();
  if(focusIdx >= vis.length) focusIdx = Math.max(0, vis.length - 1);
  let h = '';
  let lastSection = null, lastPart = null;
  vis.forEach((q, i) => {
    if(q.part !== lastPart){
      lastPart = q.part;
      h += '<div class="sechead"><h3>Part '+q.part+' &mdash; '+(q.part==='A'?'where we are':'where we are going')+'</h3></div>';
      lastSection = null;
    }
    if(q.section !== lastSection){
      lastSection = q.section;
      const all = DATA.questions.filter(x => x.section === q.section);
      const done = all.filter(x => hasAnswer(x.id)).length;
      h += '<div class="sechead" id="sec-'+q.section+'"><h3>'+q.section+'. '+esc(q.sectionTitle)+'</h3><p>'+done+' of '+all.length+' answered</p></div>';
    }
    const a = state.answers[q.id] || { options:[], answer:'', needsThought:false };
    const sk = skipInfo(q.id);
    const cls = ['q'];
    if(i === focusIdx) cls.push('focused');
    if(hasAnswer(q.id)) cls.push('done');
    if(sk) cls.push('skipped');
    h += '<div class="'+cls.join(' ')+'" id="q-'+q.id+'" data-id="'+q.id+'" data-i="'+i+'">';
    h += '<div class="qtop"><span class="qid">'+q.id+'</span>'
       + '<span class="badge '+q.priority+'">'+q.priority+'</span>'
       + '<span class="badge sec">'+q.section+' &middot; '+esc(q.topic)+'</span>'
       + (startIds.has(q.id) ? '<span class="badge start">start here</span>' : '')
       + (a.needsThought ? '<span class="badge think">needs thought</span>' : '')
       + (hasAnswer(q.id) ? '<span class="badge ok spacer">answered</span>' : '<span class="spacer"></span>')
       + '</div>';
    h += '<p class="qtext">'+md(q.question)+'</p>';
    if(sk) h += '<div class="cond"><strong>Auto-skipped.</strong> '+md(sk.reason)+' Answer it anyway if you disagree.</div>';
    h += '<p class="block"><span class="k">Context</span>'+md(q.context)+'</p>';
    h += '<p class="block"><span class="k">Why it matters</span>'+md(q.why)+'</p>';
    if(q.skip) h += '<p class="block"><span class="k">Conditional</span>'+md(q.skip)+'</p>';

    if(isFreeform(q)){
      h += '<p class="freehint">'+md(q.options[0])+'</p>';
    } else {
      h += '<div class="opts">';
      const letters = optLetters(q);
      q.options.forEach((o, oi) => {
        const l = letters[oi];
        const on = l && a.options.includes(l);
        h += '<button class="opt'+(on?' on':'')+'" data-opt="'+q.id+'" data-letter="'+(l||'')+'">'
           + '<span class="num">'+(oi+1)+'</span><span>'+md(o.replace(/^\([a-z]\)\s*/, ''))+'</span></button>';
      });
      h += '</div>';
    }
    h += '<div class="rec"><span class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:500;display:block;margin-bottom:3px">My recommendation</span>'+md(q.recommendation)+'</div>';
    h += '<label class="answerlabel" for="ta-'+q.id+'">Your answer</label>';
    h += '<textarea id="ta-'+q.id+'" data-ta="'+q.id+'" placeholder="Free text — no length limit. Pick an option above and qualify it here, or write instead of choosing.">'+esc(a.answer||'')+'</textarea>';
    h += '<div class="qfoot"><button class="mini'+(a.needsThought?' on':'')+'" data-think="'+q.id+'">'+(a.needsThought?'✓ needs thought':'Flag: needs thought')+'</button>'
       + '<button class="mini" data-clear="'+q.id+'">Clear</button></div>';
    h += '</div>';
  });
  if(!vis.length) h = '<div class="panel"><p>Nothing matches these filters.</p></div>';
  document.getElementById('list').innerHTML = h;
  document.querySelectorAll('textarea').forEach(autosize);
  paintProgress();
  renderNav();
}

function autosize(ta){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }

function paintProgress(){
  const done = DATA.questions.filter(q => hasAnswer(q.id)).length;
  const tot = DATA.questions.length;
  const think = DATA.questions.filter(q => state.answers[q.id] && state.answers[q.id].needsThought).length;
  const pct = tot ? Math.round(done/tot*100) : 0;
  const txt = done + ' / ' + tot + ' answered · ' + (tot-done) + ' left' + (think ? ' · ' + think + ' flagged' : '');
  document.getElementById('topBar').style.width = pct + '%';
  document.getElementById('sideBar').style.width = pct + '%';
  document.getElementById('topText').textContent = txt;
  document.getElementById('sideText').textContent = done + ' / ' + tot;
}

function renderNav(){
  let h = '';
  let lastPart = null;
  for(const s of DATA.sections){
    if(s.part !== lastPart){
      lastPart = s.part;
      h += '<button class="navitem" data-nav="part-'+s.part+'" style="pointer-events:none"><span class="dot part"></span><strong>Part '+s.part+'</strong></button>';
    }
    const done = s.ids.filter(hasAnswer).length;
    h += '<button class="navitem'+(done===s.ids.length?' active':'')+'" data-nav="'+s.key+'">'
       + '<span>'+s.key+' '+esc(s.title)+'</span><span class="frac">'+done+'/'+s.ids.length+'</span></button>';
  }
  document.getElementById('nav').innerHTML = h;
}

/* ── mutations ─────────────────────────────────────────────────── */
function toggleOpt(id, letter){
  if(!letter) return;
  const a = ans(id);
  const i = a.options.indexOf(letter);
  if(i >= 0) a.options.splice(i,1); else a.options.push(letter);
  a.options.sort();
  save(); renderList();
}
function toggleThink(id){ const a = ans(id); a.needsThought = !a.needsThought; save(); renderList(); }
function clearQ(id){ delete state.answers[id]; save(); renderList(); }

/* ── export / import ───────────────────────────────────────────── */
function buildExport(){
  const out = { document: DOC, version: 1, exportedAt: new Date().toISOString(), answers: {} };
  for(const q of DATA.questions){
    const a = state.answers[q.id];
    if(!a) continue;
    const opts = a.options || [];
    const txt = (a.answer || '').trim();
    if(!opts.length && !txt && !a.needsThought) continue;
    out.answers[q.id] = { options: opts, answer: a.answer || '', needsThought: !!a.needsThought, autoSkipped: !!skipInfo(q.id) };
  }
  out.counts = { answered: Object.keys(out.answers).filter(k => (out.answers[k].options.length || out.answers[k].answer.trim())).length, total: DATA.questions.length };
  return JSON.stringify(out, null, 2);
}
function doExport(){
  const txt = buildExport();
  try {
    const blob = new Blob([txt], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'questionnaire-answers.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    dirtySinceExport = false; paintSaved();
  } catch(e){
    doCopy();
  }
}
function doCopy(){
  const txt = buildExport();
  const done = () => { dirtySinceExport = false; paintSaved(); flash('Copied — paste it into docs/audit/questionnaire-answers.json'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => legacyCopy(txt, done));
  } else legacyCopy(txt, done);
}
function legacyCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ alert('Copy failed. Select the JSON manually:\n\n' + txt.slice(0,400) + '…'); }
  ta.remove();
}
function flash(msg){
  const el = document.getElementById('saved');
  const old = el.textContent; el.textContent = msg;
  setTimeout(() => paintSaved(), 2600);
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const src = j.answers || j;
      let n = 0;
      for(const k of Object.keys(src)){
        if(!byId[k]) continue;
        const v = src[k] || {};
        state.answers[k] = { options: Array.isArray(v.options)?v.options:[], answer: typeof v.answer==='string'?v.answer:'', needsThought: !!v.needsThought };
        n++;
      }
      save(); renderList(); flash('Imported ' + n + ' answers');
    } catch(e){ alert('That file could not be read as questionnaire JSON.'); }
  };
  r.readAsText(file);
}

/* ── events ────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const opt = e.target.closest('[data-opt]');
  if(opt){ toggleOpt(opt.dataset.opt, opt.dataset.letter); return; }
  const th = e.target.closest('[data-think]');
  if(th){ toggleThink(th.dataset.think); return; }
  const cl = e.target.closest('[data-clear]');
  if(cl){ clearQ(cl.dataset.clear); return; }
  const jp = e.target.closest('[data-jump]');
  if(jp){ jumpTo(jp.dataset.jump); return; }
  const nv = e.target.closest('[data-nav]');
  if(nv){ const el = document.getElementById('sec-'+nv.dataset.nav); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const card = e.target.closest('.q');
  if(card){ focusIdx = Number(card.dataset.i); paintFocus(); }
});
document.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.ta){
    ans(e.target.dataset.ta).answer = e.target.value;
    autosize(e.target);
    save(); paintProgress(); renderNav();
    const card = e.target.closest('.q');
    if(card) card.classList.toggle('done', hasAnswer(e.target.dataset.ta));
  }
});

function jumpTo(id){
  filters = { un:false, must:false, start:false, think:false, showSkipped:true, q:'' };
  syncFilterUI(); renderList();
  const vis = visibleList();
  const i = vis.findIndex(q => q.id === id);
  if(i >= 0){ focusIdx = i; paintFocus(); scrollToFocus(); }
}
function paintFocus(){
  document.querySelectorAll('.q').forEach(el => el.classList.toggle('focused', Number(el.dataset.i) === focusIdx));
}
function scrollToFocus(){
  const el = document.querySelector('.q[data-i="'+focusIdx+'"]');
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function syncFilterUI(){
  document.getElementById('fUn').checked = filters.un;
  document.getElementById('fMust').checked = filters.must;
  document.getElementById('fStart').checked = filters.start;
  document.getElementById('fThink').checked = filters.think;
  document.getElementById('fSkip').checked = filters.showSkipped;
  document.getElementById('search').value = filters.q;
}

document.getElementById('fUn').onchange    = e => { filters.un = e.target.checked; focusIdx=0; renderList(); };
document.getElementById('fMust').onchange  = e => { filters.must = e.target.checked; focusIdx=0; renderList(); };
document.getElementById('fStart').onchange = e => { filters.start = e.target.checked; focusIdx=0; renderList(); };
document.getElementById('fThink').onchange = e => { filters.think = e.target.checked; focusIdx=0; renderList(); };
document.getElementById('fSkip').onchange  = e => { filters.showSkipped = e.target.checked; focusIdx=0; renderList(); };
document.getElementById('search').oninput  = e => { filters.q = e.target.value.trim().toLowerCase(); focusIdx=0; renderList(); };
document.getElementById('btnExport').onclick = doExport;
document.getElementById('btnCopy').onclick = doCopy;
document.getElementById('btnImport').onclick = () => document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = e => { if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };

document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(KEY + ':theme', next); } catch(e){}
};

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'textarea' || tag === 'input';
  if(e.key === 'Escape'){ if(typing){ e.target.blur(); scrollToFocus(); } return; }
  if(typing) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const vis = visibleList();
  if(e.key === 'j'){ e.preventDefault(); focusIdx = Math.min(focusIdx+1, vis.length-1); paintFocus(); scrollToFocus(); }
  else if(e.key === 'k'){ e.preventDefault(); focusIdx = Math.max(focusIdx-1, 0); paintFocus(); scrollToFocus(); }
  else if(e.key === '/'){ e.preventDefault(); document.getElementById('search').focus(); }
  else if(e.key === 'e'){ e.preventDefault(); doExport(); }
  else if(e.key === 'Enter'){
    const q = vis[focusIdx]; if(!q) return;
    e.preventDefault();
    const ta = document.getElementById('ta-'+q.id);
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  else if(e.key === 't'){ const q = vis[focusIdx]; if(q){ e.preventDefault(); toggleThink(q.id); } }
  else if(/^[1-9]$/.test(e.key)){
    const q = vis[focusIdx]; if(!q) return;
    const letters = optLetters(q);
    const l = letters[Number(e.key)-1];
    if(l){ e.preventDefault(); toggleOpt(q.id, l); }
  }
});

window.addEventListener('beforeunload', e => {
  if(dirtySinceExport && Object.keys(state.answers).length){ e.preventDefault(); e.returnValue = ''; return ''; }
});

/* ── boot ──────────────────────────────────────────────────────── */
try {
  const t = localStorage.getItem(KEY + ':theme');
  if(t) document.documentElement.setAttribute('data-theme', t);
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');
} catch(e){}
restore();
document.getElementById('hdrCount').textContent = DATA.counts.total;
renderIntro(); renderClosing(); renderList(); paintSaved();
</script>
</body>
</html>
