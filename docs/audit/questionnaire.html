y data-invariant check.","question":"Is there a lower-friction way to give sessions read-only DB access, and do you want one?","why":"A verification step that is annoying to run is a verification step that quietly stops being run — and that is the step guarding your money invariants.","options":["(a) Accept the OAuth step as the cost of not storing a credential.","(b) Put a read-only Postgres connection string in `.env.local` for a scripted invariant check, keeping the MCP for exploration.","(c) No change."],"recommendation":"(b), paired with Q-045 (b). A scripted read-only check is also what makes the invariants runnable in CI later, which the MCP never can be.","skip":""},{"id":"Q-054","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Doc size","priority":"NICE","context":"`PROJECT-CONTEXT.md` is 1,133 lines after the audit rewrite. §6.3 alone is 279 lines of narrative record of phases that shipped between 9 and 30 July; §7 is 225 lines of decision log. The file's own §0 exists to explain how to read it, and it is pasted into every new chat.","question":"Should §6.3's shipped-phase narrative move to a separate history file, leaving §6 as the status tables only?","why":"The file is loaded into limited context windows by every new chat and every Claude Code session. §6.3 is the part least likely to be needed and the largest part that only grows.","options":["(a) Yes — move §6.3 to `docs/history.md`, leave §6.1/§6.2 plus a pointer.","(b) No — the reasoning lives with the status, and splitting invites exactly the drift the audit just fixed.","(c) Trim §6.3 to one paragraph per phase rather than moving it."],"recommendation":"(b). The audit's central finding was that status split across files drifts within weeks. If size becomes a real problem, (c) is the safer lever — it keeps one home while cutting the bulk.","skip":""},{"id":"Q-055","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Repo presentation","priority":"NICE","context":"`README.md` was rewritten during the audit (41 lines) to describe the app, how to run it, and the reading order. It is the front page of a private repo with one maintainer, alongside a 12-chapter course written for an outside reader.","question":"Does the repo need to present well to anyone other than you?","why":"It changes how much polish the README, the course (Q-017) and any onboarding material deserve — and whether this project is ever shown to anyone.","options":["(a) Private forever — the README is for future-me.","(b) It may be shown to employers or collaborators — keep it presentable.","(c) It may go public one day."],"recommendation":"No strong view, but answer it before Q-065 — it is the same question at a smaller scale, and (b) would make the course worth finishing rather than freezing.","skip":""},{"id":"Q-056","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Error visibility","priority":"SHOULD","context":"The app has no error reporting and no shared error surface. Failures show up as unhandled promise rejections in the console — `PROJECT-CONTEXT.md` §8 names two patterns that produce exactly this — or as a modal stuck in a committing state with the button disabled and nothing on screen. The documented verification method is 'run the app and check the browser console'.","question":"Is any user-facing error visibility worth adding — a toast on failed writes, or a real error reporter?","why":"Three of this file's money-path questions (Q-018, Q-019, Q-024) describe failures that are currently silent to the user. Fixing the atomicity without fixing the silence means the user still cannot tell when something went wrong; fixing the silence without the atomicity at least tells them to look.","options":["(a) A shared toast / error surface for failed writes. No external service.","(b) (a) plus an error reporter (e.g. Sentry free tier).","(c) Neither — the console is fine for one user."],"recommendation":"(a). It is the missing half of every atomicity fix in section A3, it needs no third party — which matters given the privacy stance in B6 — and it is a single component plus a context.","skip":""},{"id":"Q-057","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"budget_allocations","priority":"SHOULD","context":"`budget_allocations` exists in the live DB with a full shape (`user_id`, `wallet_id`, `amount` numeric NOT NULL, `valid_from` date NOT NULL, `valid_until` date, `created_at`), **0 rows**, and no read or write anywhere in `src/` — confirmed by grep in Session 1 and by live query on 2026-09-14 (audit DISC-20). It is still deleted by `reset_user_data`, named in the backup plan's export list, and `docs/dashboard-recon.md` §2 warns a redesign not to assume it.","question":"Drop it, or keep it as a designed-but-unused slot for time-boxed budgets?","why":"A table with a coherent shape and no users is an invitation to build the wrong thing on it — the shape implies a per-period budget model that competes directly with `wallets.budget`, which is what the app actually uses.","options":["(a) Drop it in a migration.","(b) Keep it, documented in §4 as reserved for time-boxed budgets.","(c) Keep it and actually build time-boxed budgets."],"recommendation":"(a), unless Q-085 says time-boxed budgets are genuinely wanted. It is the only table in the schema with no purpose in the running app. Answer Q-085 first.","skip":"Answer after Q-085."},{"id":"Q-058","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"Conflict history","priority":"NICE","context":"`unallocated_pending_conflicts` drives the whole conflict-stall mechanism — written at `unallocatedPlans.js:103`, read at `:61` and `:91`, resolved by `UnallocatedConflictBanner.jsx:65,77` — and carries `status`, `chosen_plan_id` and `resolved_at`. Resolved rows are never deleted, and nothing displays them. It is cleared by both tiers of `reset_user_data`.","question":"Should resolved conflicts be retained as history, or cleaned up?","why":"They are currently permanent rows with no UI at all. If they are history, something should show them; if they are not, they should be cleared on resolve.","options":["(a) Retain, and surface them in the Unallocated history tab.","(b) Delete on resolve.","(c) Retain silently — they are small and might be useful one day."],"recommendation":"(a). A stall is a moment when the app declined to move money and asked you to choose — that is exactly the kind of event a history tab exists for, and it pairs naturally with the plan-firing log in Q-003.","skip":""},{"id":"Q-059","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"wallets.colour","priority":"SHOULD","context":"`wallets.colour` is still written by `WalletModal.jsx:79` from a default, still stored, and read by nothing — wallet identity became the icon in R2. `DESIGN-SPEC.md` §2 still instructs 'Map existing wallet `colour` values onto these families', which the audit flagged as stale (DISC-21) while noting the five ramps themselves remain live for flow-diagram source colours (per income, not per wallet).","question":"Stop writing `colour`, or bring it back as a user choice?","why":"§7 records that you disliked the colour picker, and the density pass chose one coral identity over the mockup's per-wallet rainbow. Meanwhile a live write to a column nothing reads is the sort of thing that convinces the next reader a feature exists.","options":["(a) Stop writing it, mark the column dead in §4, and fix the stale `DESIGN-SPEC.md` sentence.","(b) Leave it written — harmless, and a future rainbow might want it.","(c) Reintroduce per-wallet colour as an option alongside the icon."],"recommendation":"(a). It is the last live write to a column nothing reads, and the spec sentence is actively misleading to anyone implementing new wallet UI.","skip":""},{"id":"Q-060","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"Baseline migration","priority":"MUST","context":"The base schema has **no migration file at all**: `wallets`, `transactions`, `income_entries`, `income_recurring`, `income_templates`, `recurring_rules`, `budget_allocations`, `settings`, all four `unallocated_*` tables, `unallocated_pending_conflicts`, `income_distribution_rules`, `income_template_distribution_items`, the `handle_new_user()` signup trigger, and the four core balance RPCs. `supabase/migrations/` starts at 2026-07-09 and holds six files, and nothing applies them automatically — the owner runs each by hand (`PROJECT-CONTEXT.md` §8).","question":"Is it worth capturing the current live schema as a baseline migration?","why":"Today a new environment cannot be created from this repo at all — not a test project, not a Supabase branch for the RPC tests in Q-045, not a restored backup. That single constraint blocks several other answers in this file, and it means the repo does not describe the thing it deploys.","options":["(a) Yes — dump the live schema once into `supabase/migrations/00000000000000_baseline.sql` and treat later files as incremental.","(b) Yes, and adopt the Supabase CLI / `db push` properly.","(c) No — the live DB is the source of truth and always will be."],"recommendation":"(a). It is a read-only dump plus one commit. It makes the migrations folder honest, and it is the prerequisite for testing the RPCs (Q-045 (a)), for a separate test project (Q-113 (b)), and for disaster recovery. If (c), then Q-045 (a) and Q-113 (b) are both impossible and should be answered accordingly.","skip":""},{"id":"Q-061","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"settings.bank_provider","priority":"NICE","context":"`settings` carries `bank_provider` with a CHECK, added by the 2026-07-26 import migration, alongside the three dead columns from Q-031. `SUPPORTED_BANKS` in `detectBank.js` currently contains one bank.","question":"Is `bank_provider` doing real work, or is it the same shape as `currency` — a column for a feature with one possible value?","why":"It is a stored preference between one option. The difference from `currency` is that it is actually read (`Import.jsx:153`), so it is not dead — but it is not yet load-bearing either.","options":["(a) Keep — a second bank is plausible and the column will be needed.","(b) Mark it as reserved, the way `imported_statements` should be (Q-009).","(c) Drop it."],"recommendation":"(a). Unlike `currency` it is read at runtime, and it is the natural extension point for whatever Q-004 decides about a second bank.","skip":""},{"id":"Q-062","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"Query patterns","priority":"SHOULD","context":"Every page fetches with `select('*')` and aggregates client-side. The dashboard alone fetches six tables on mount with no server-side aggregation (`docs/dashboard-recon.md` §1). `PROJECT-CONTEXT.md` §8 puts the Supabase free-tier ceiling at roughly 200–250 active users, egress-bound, at about 250 rows per user per month.","question":"Is the fetch-everything pattern fine permanently, and at what point would it stop working?","why":"It determines whether the dashboard rebuild can keep computing client-side, whether encryption's 'the browser does the math' cost is acceptable (it is, at this scale), and whether pagination ever needs to exist anywhere.","options":["(a) Free tier and single-digit users permanently — fetch-everything is fine forever.","(b) Free tier for now, but design for a few hundred users.","(c) Will pay and scale if it grows."],"recommendation":"(a), unless Q-065 says this becomes a product. At one user with a few thousand rows, client-side aggregation is genuinely faster than a round trip, and designing for scale you will not reach is how simple apps get complicated.","skip":""},{"id":"Q-063","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"Invariants","priority":"SHOULD","context":"The `db-verifier` agent exists to check data invariants read-only after money-touching flows, and §6.3 records real passes (0.00 balance drift across five wallets, both new import tables empty and constraint-sound). But the invariants themselves live in the agent's markdown prompt, not as committed SQL.","question":"What is the definitive list of invariants, and should it be version-controlled as SQL?","why":"An invariant that lives in an agent prompt cannot be run in CI, cannot be diffed, and quietly changes meaning as the prompt is edited. I can name four from the artefacts — balance equals the sum of confirmed transactions per wallet; every income entry's credits sum to its amount; no orphaned distribution rows; `user_id` non-null everywhere — but not authoritatively, and there are references to 'invariants 1, 2 and 5' that I could not fully reconstruct.","options":["(a) Write them as a committed read-only SQL script the agent runs.","(b) Keep them in the agent prompt.","(c) Both — the script is the source, the prompt points at it."],"recommendation":"(c). It is also what makes Q-045 (b) and Q-053 (b) possible, and it means the numbered invariants in §6.3 finally refer to something you can open.","skip":""},{"id":"Q-064","part":"A","section":"A8","sectionTitle":"Data and schema","topic":"Paid/unpaid model","priority":"NICE","context":"There is no explicit due/paid status column. A recurring payment counts as paid when a matching `transactions` row exists for that `recurring_rule_id` and date with `is_confirmed = true`; unpaid or overdue means the row is missing or unconfirmed. That inference feeds `getOverduePayments` and `unpaidUpcomingCosts`, which drive the dashboard's most prominent alert (`docs/dashboard-recon.md` §2f).","question":"Is the inferred paid/unpaid model working in real use, or does it produce wrong 'overdue' claims?","why":"It is the one place the app's data model does not directly store something its UI asserts. Only you can answer it, from actually using the app — a false overdue is invisible to code review and obvious to a user.","options":["(a) Works fine.","(b) It produces false overdues — I will describe when.","(c) I do not look at that section."],"recommendation":"No recommendation — this is a pure observation question. (c) is a genuinely useful answer for the dashboard rebuild, because a section you ignore is a section to cut.","skip":""},{"id":"Q-065","part":"B","section":"B1","sectionTitle":"Definition of done","topic":"What this is","priority":"MUST","context":"The code reads as a single-household envelope-budgeting app for one person: no sharing, no household, no invites. Every table is `user_id`-scoped with four `{table}_{cmd}_own` RLS policies, so two users have entirely disjoint datasets — multi-user exists as isolation, not collaboration (`docs/audit/UNDERSTANDING.md` §1). Meanwhile signup is open with email verification, and the free tier supports roughly 200–250 users.","question":"Is this a personal tool that happens to have multi-user support, or a product intended for people beyond you?","why":"This is the single answer that scales every other answer in this file — how much error handling, how much onboarding, whether the free-tier ceiling is a real constraint, whether admin-visible data is acceptable, whether account deletion is required, and what 'polished' means.","options":["(a) Personal tool, permanently — multi-user is deployment hygiene.","(b) Personal, but I would let friends or family use it.","(c) A real product I intend other people to use."],"recommendation":"No recommendation — this one is genuinely yours. But note that the code currently assumes (a) everywhere it makes a trade-off, and answering (c) would reopen roughly a third of this questionnaire (onboarding, account deletion, encryption, scale, signup, domain, error reporting).","skip":""},{"id":"Q-066","part":"B","section":"B1","sectionTitle":"Definition of done","topic":"Stopping point","priority":"MUST","context":"The app is already in real use — the live DB holds 18 wallets, real Unallocated plans and templates, and the owner's account has been active since June. Yet the roadmap still carries three unbuilt phases, two of which (backup, encryption) are infrastructure rather than features you would notice day to day.","question":"What would you be happy to stop at? Describe the version where you would say 'that's it, I just use it now'.","why":"'Done' is the only thing that turns the remaining scope into a finite list. Without it a roadmap can only grow, and this one has not lost an item since July.","options":["(a) Essentially done — the dashboard rebuild, then maintenance.","(b) Done once backup exists.","(c) Done once encryption exists.","(d) There is a specific feature still missing, which I will name."],"recommendation":"No recommendation. But if (a) or (b), several sections below shorten dramatically, and that is worth knowing before any further building.","skip":""},{"id":"Q-067","part":"B","section":"B1","sectionTitle":"Definition of done","topic":"What is missing","priority":"MUST","context":"The audit can find gaps from the code, but not the ones that annoy you in daily use. The three I would guess from the artefacts: the dashboard has no top-line summary (`docs/dashboard-recon.md` §5), there is no mobile view at all (`Layout.jsx:35`), and an investment wallet's detail page shows nothing (`WalletDetail.jsx:461`).","question":"What would make you call this incomplete? What is missing that actually bothers you when you use it?","why":"This is the question I would most want answered if I could only ask one. Everything else in this file is derived from the code; this is the only place the answer can come from you using the thing.","options":["(Free text — but if any of the three guesses above are right, saying so is enough.)"],"recommendation":"None.","skip":""},{"id":"Q-068","part":"B","section":"B1","sectionTitle":"Definition of done","topic":"Onboarding","priority":"SHOULD","context":"There is no onboarding. A new user gets a signup trigger that creates a settings row and an Unallocated wallet, then lands on a dashboard whose empty state is the string 'Nothing here yet' (`docs/dashboard-recon.md` §1).","question":"Does onboarding matter?","why":"Directly downstream of Q-065. If that is (a), this is a firm no. Anything else and the first-run experience is currently a blank page next to an empty sidebar.","options":["(a) No — I am the only user and I know how it works.","(b) A minimal first-run guide (create a wallet, add an income).","(c) Real onboarding with sample data."],"recommendation":"(a) if Q-065 is (a). If Q-065 is (b) or (c), go to (b) — (c) is a product-sized investment and the wallet model needs explaining more than the UI does.","skip":"If Q-065 is (a), this is (a)."},{"id":"Q-069","part":"B","section":"B1","sectionTitle":"Definition of done","topic":"Production bar","priority":"SHOULD","context":"The app is deployed on Vercel from `main` with an SPA rewrite. There is no error reporting, no analytics, no uptime check. The only way to learn something broke is to use it and notice (Q-056).","question":"What does 'in production' mean for this app — is there a standard you hold it to, or is breakage just something you fix when you hit it?","why":"It sets the bar for Q-056 and for how much defensive work the atomicity questions in section A3 actually deserve. If silent failure is acceptable, several recommendations downgrade.","options":["(a) I fix it when I notice — that is fine.","(b) I want to know when a write fails, inside the app.","(c) I want to know when a write fails, out of band (email, alert)."],"recommendation":"(b). It is the version that costs one toast component and nothing else, and it is what makes the A3 fixes meaningful rather than invisible.","skip":""},{"id":"Q-070","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Dashboard rebuild","priority":"MUST","context":"`PHASE-ROADMAP.md` Phase A — the dashboard rebuild, CHAT-FIRST, with recon written 2026-07-16 and still accurate except for nine baseline screenshots deleted in the 2026-09 cleanup and needing re-capture. `docs/dashboard-recon.md` §5 calls the 30-day projection 'the one true hero' and names three concrete problems: duplicate 'Needs attention', no top-line summary, and a misleading six-month outlook.","question":"Is the dashboard rebuild still wanted, in this shape, and where does it rank?","why":"It is the only phase with recon already done and the only one where the audit found specific, nameable problems to fix. It also carries the `now`-injection testing prerequisite (Q-044), and it is the screen you look at most.","options":["(a) Yes, next — the highest-value remaining work.","(b) Yes, but after the money-path atomicity work in A3.","(c) Scale it down to the three named fixes rather than a rebuild.","(d) No longer wanted."],"recommendation":"(a) or (c). The recon's three findings are most of the value at a fraction of the cost; a full rebuild only earns its keep if you have a genuinely different answer to Q-086 ('what should the first screen say'). Answer Q-086 first, then come back to this.","skip":"Answer after Q-086."},{"id":"Q-071","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Backup / restore","priority":"MUST","context":"`PHASE-ROADMAP.md` Phase B — backup and export/import, plan at `docs/plans/backup-restore-feature-plan.md`, written 2026-07-07. It predates the two-tier reset, the four `unallocated_*` tables, both import sources and the whole redesign, and its export list names `budget_allocations` (0 rows, unused). It is the stated prerequisite for encryption.","question":"Still wanted, and does it rank above the dashboard?","why":"Its standalone value — data portability and disaster recovery — is real even without encryption, but it is invisible in daily use. Its strategic value disappears entirely if encryption is dropped (Q-072).","options":["(a) Yes, and it goes first — my data is not backed up and that bothers me.","(b) Yes, after the dashboard.","(c) Only if encryption happens.","(d) No — Supabase's own backups are enough."],"recommendation":"(a) if you have no export today and the data matters to you; otherwise (b). Before choosing (d), check what point-in-time recovery your Supabase plan actually gives you — on the free tier it is less than people assume, and your own app has an OTP-gated 'Full reset' button.","skip":""},{"id":"Q-072","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Client-side encryption","priority":"MUST","context":"`PHASE-ROADMAP.md` Phase C — client-side encryption, plan at `docs/plans/encryption-with-key-plan.md`, scoped in its own words as 'substantial, comparable to or larger than the multi-user work'. Two open discussions remain unresolved inside it: balance atomicity without DB-side math, and which features lose DB-side filtering and sorting.","question":"Still wanted, at what priority, and in what scope?","why":"It is the largest item on the books and the only one that would force a rewrite of the money layer — the same layer sections A3 and A6 want to move *further into* the database. Those two directions are in direct tension and only one can win. Deciding this settles Q-018, Q-038, Q-045 and Q-046 at the same time.","options":["(a) Full encryption as planned.","(b) Partial — encrypt names and notes, leave amounts and balances plaintext so the RPCs survive.","(c) Parked indefinitely.","(d) Dropped, and remove the plan from the roadmap."],"recommendation":"(b) or (c). Note the tension explicitly: Q-018 and Q-038 recommend moving *more* money logic into atomic database functions, and full encryption requires moving all of it out — including the balance RPCs that are the project's hardest rule. (b) is the version that costs nothing architecturally, because names and notes are never summed, sorted or compared by the database. If (c) or (d), skip Q-107 and Q-109.","skip":""},{"id":"Q-073","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Privacy mode","priority":"SHOULD","context":"Privacy mode shipped session-only in PR #10 — a module-level flag in `src/lib/format.js:16` masking to `€ ••••` and `€••`, reset to visible on reload by design, with `format.js:12-16` saying so explicitly. There is no `hide_balances` column, and the audit's live-DB pass confirmed none exists (DISC-23). The original plan called for one; the implementation deliberately diverged and nobody recorded whether that divergence is final.","question":"Should privacy mode persist across reloads?","why":"It is a small, cheap decision that has been implicitly open since July, and the roadmap used to carry a migration for it that must never be written.","options":["(a) Session-only is right — it is a shoulder-surfing toggle, not a preference.","(b) Persist it per device in `localStorage`.","(c) Persist it in `settings` as a real preference."],"recommendation":"(a). A privacy toggle that survives a reload eventually surprises you by hiding your own numbers when you had forgotten it was on. If you want (b) it is roughly ten lines and no migration; (c) buys nothing (b) does not.","skip":""},{"id":"Q-074","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Investment wallets","priority":"SHOULD","context":"`PHASE-ROADMAP.md` Parked — 'Investment wallet type (phase 7 of the old numbering)'. Unlike everything else parked, this one already has code in the app: the type is creatable, fundable, listed and iconed, with a detail page that says 'coming in Phase 7' (Q-008).","question":"Is the investment wallet type still wanted, and what would it actually do?","why":"It is the only parked item with half-built code sitting in production. Everything else parked is unstarted, which is a much cheaper state to leave something in.","options":["(a) Yes — manual valuation over time, contributions versus current value.","(b) Yes, minimally — just a balance and history like any other wallet.","(c) No — remove the type."],"recommendation":"(b). It closes the dead-end page with no new concepts and no schema change, and (a) can follow later if you ever want real valuation tracking.","skip":""},{"id":"Q-075","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"AI features","priority":"SHOULD","context":"`PHASE-ROADMAP.md` Parked — 'AI features (natural-language transaction entry)'. The roadmap records that the PDF-import phase considered and **rejected** Claude-API extraction in favour of a deterministic parser, because bank statements are sensitive — so the rails for 'an AI writes transactions safely' were never built.","question":"Still wanted, and does the rejection reasoning still apply?","why":"Natural-language entry writes money, so it needs the same rails the import pipeline has (preview, explicit confirm, nothing auto-committed) plus a reason to trust a model's parse. That is a substantial build, not a small add-on.","options":["(a) Yes — natural-language entry for hand-typed transactions (not statements), with a mandatory preview.","(b) Yes, but a different AI feature which I will name.","(c) No."],"recommendation":"(c) for now, or (a) strictly scoped. The sensitivity argument that killed it for statements does not apply to typing '€12 lunch' — but the write-safety rails still have to be built, and the app already has a fast manual entry path.","skip":""},{"id":"Q-076","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Unlisted wants","priority":"MUST","context":"The current books hold: dashboard rebuild, backup, encryption, investment wallets, AI entry, and the page-split refactor. That list has not gained an item since July.","question":"What is **not** on the books that you want? Anything you have thought 'I wish it did X' while using it?","why":"A roadmap assembled only from what was already planned tends to build the wrong things well. This is the one question in the file whose answer cannot come from the code.","options":["(Free text.)"],"recommendation":"None.","skip":""},{"id":"Q-077","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Cuts","priority":"MUST","context":"A scope list that only grows is not a plan. My candidates for cutting, in order of confidence: client-side encryption as planned (Q-072), the classic-statement third import source (Q-009), AI entry (Q-075), and time-boxed budgets / `budget_allocations` (Q-057, Q-085).","question":"What should be **cut**?","why":"Cutting is the only operation that makes the remaining work finite, and every cut item also removes its maintenance debt from the docs — a plan file, a schema slot, a roadmap entry, and the questions they keep generating.","options":["(a) Cut encryption-as-planned and the third import source.","(b) Cut all four candidates.","(c) Cut something else, which I will name.","(d) Cut nothing."],"recommendation":"(a) at minimum. Both are large, both are speculative, and both currently distort decisions elsewhere — encryption pulls against Q-018 and Q-038, and `imported_statements` keeps appearing in schema discussions as though it were a live table.","skip":""},{"id":"Q-078","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Page split","priority":"SHOULD","context":"`docs/audit/STRUCTURE-REVIEW.md` and `PHASE-ROADMAP.md` Parked — splitting `Income.jsx`, `Import.jsx` and `WalletDetail.jsx`, gated behind component tests (Q-043) and the unmerged Budgeting branch (Q-015). §7 records the gating conditions specifically so the decision is not relitigated casually.","question":"Does the page split ever happen, or is it permanently parked?","why":"It is the only 'internal quality' item on the roadmap and it competes directly with feature work. Parking it indefinitely is a legitimate answer that should be stated once rather than re-decided every session.","options":["(a) It happens once component tests exist.","(b) Permanently parked — record the decision and stop raising it.","(c) Partial only — extract the self-contained modals and sub-views (Q-049 (c))."],"recommendation":"(b), unless you find yourself repeatedly struggling to change those files. The audit could not name a symptom, and a refactor without a symptom is risk without payoff.","skip":""},{"id":"Q-079","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Manual posting","priority":"SHOULD","context":"Nothing in the app posts automatically. Recurring income is logged by hand from `IncomeRecurringDetail`, recurring expenses are ticked off in `TransactionChecklist`, and there is no scheduler, cron job or edge function anywhere in the project (verified). It is why Unallocated plans use check-on-change rather than a background job, and why the import's recurring-link exclusion logic works at all.","question":"Is manual posting the permanent design, or would you want recurring items to post themselves?","why":"It is the single biggest behavioural assumption in the app, and it is only documented in `PROJECT-CONTEXT.md` §5 — not in `CLAUDE.md`, which is where a reader meeting the word 'recurring' first lands. Automatic posting would need a scheduler the architecture has no place for, and it would make the capped-wallet mechanic fire unattended.","options":["(a) Manual forever — posting is the moment you confirm reality matches the plan.","(b) Automatic, with a confirmation queue.","(c) Fully automatic on the due date."],"recommendation":"(a). It is what makes check-on-change sufficient, it keeps the import's recurring-link logic coherent, and (c) would move real money with no human present on paths that are currently non-atomic. If (a), it belongs in `CLAUDE.md` as a stated design principle.","skip":""},{"id":"Q-080","part":"B","section":"B2","sectionTitle":"Remaining scope","topic":"Quality versus features","priority":"SHOULD","context":"Six of ten money paths are non-atomic, three files exceed 1,000 lines, lint has been red for months, and there are no component tests. None of that is visible to a user. Section A of this questionnaire contains roughly 25 actionable items.","question":"How should internal quality be weighed against features in the remaining roadmap — roughly what share of effort goes to the A-section items?","why":"Without a rough proportion, internal work either happens all at once (stalling features) or never (accumulating until something breaks).","options":["(a) Fix the money-path atomicity, then features only.","(b) Alternate — one internal item per feature.","(c) Features first; internal work only when it blocks something.","(d) Internal quality first until the A-list is empty."],"recommendation":"(a). The atomicity work is the only internal item that can produce wrong money; almost everything else in section A is comfort, and comfort can wait.","skip":""},{"id":"Q-081","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Backup contents","priority":"MUST","context":"`docs/plans/backup-restore-feature-plan.md` lists the export as wallets, transactions, recurring rules, income entries, income recurring, income templates, distribution rules, `budget_allocations` and settings. Since it was written the schema gained four `unallocated_*` tables, `unallocated_pending_conflicts`, and four import tables — and `budget_allocations` turned out to be empty and unused.","question":"What exactly goes in a backup — specifically, does it include imported transactions, counterparty learning, and the import bookkeeping tables?","why":"It decides whether a restore reproduces your account or only its structure, and whether re-importing a statement after a restore double-counts everything.","options":["(a) Everything user-scoped, including import tables and `import_fingerprint` values — a restore is faithful.","(b) Everything except the import bookkeeping (`imported_statements`, `monthly_balance_snapshots`, `recurring_import_links`) — cleaner, but a restored account re-asks every recurring question.","(c) Core money data only (wallets, transactions, income, rules) — smallest and most portable."],"recommendation":"(a). Fingerprints in particular must survive, or the first import after a restore re-imports every transaction you already have — which is the exact failure the dedupe layer exists to prevent.","skip":"Only relevant if Q-071 is (a) or (b)."},{"id":"Q-082","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Restore semantics","priority":"SHOULD","context":"The backup plan proposes importing into a freshly re-registered account, remapping old wallet ids to newly created ones, and reconciling with the Unallocated wallet and settings row that `handle_new_user()` creates automatically. It says there should be 'a confirmation step on import if the account already has data, so a restore does not silently clobber existing data' — but never says what the confirmed behaviour actually is.","question":"What happens when you restore into an account that already has data?","why":"Replace, refuse and merge are three very different features. Merge in particular is where restore features go to become bug reports, because ids have been remapped and duplicate detection across two histories is genuinely hard.","options":["(a) Replace — run the equivalent of a full reset first, then restore.","(b) Refuse — restore only into an empty account.","(c) Merge, with id remapping and duplicate detection."],"recommendation":"(b) as the shipped behaviour, with (a) available behind the existing OTP-gated danger-zone confirmation. The two-tier reset already exists, so (a) is mostly wiring; (c) should not be attempted.","skip":"Only relevant if Q-071 is (a) or (b)."},{"id":"Q-083","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Wallet deletion","priority":"MUST","context":"`src/pages/Wallets.jsx:53-58` — `handleDelete` refuses only for system wallets, then hard-deletes the row: `await supabase.from('wallets').delete().eq('id', wallet.id)`. **There is no balance check.** The confirmation copy at `:170-172` says the wallet 'and all its transactions will be permanently deleted', which is honest about the transactions but says nothing about the money: a wallet holding €300 can be deleted, and that €300 vanishes from the sum of balances with no transaction recording where it went. Other rows may also point at it — `income_distribution_rules.wallet_id`, `unallocated_plan_items`, and other wallets' `overflow_wallet_id`.","question":"What should happen when a wallet with a non-zero balance is deleted — and should it be possible at all?","why":"This is the one behaviour the audit found that can destroy money with no record, and it is reachable from the Wallets page in two clicks. Every other money path in the app is careful; this one is not guarded at all.","options":["(a) Refuse to delete a wallet with a non-zero balance — require moving the money out first.","(b) Require choosing a destination wallet, and move the balance as a recorded transfer before deleting.","(c) Deactivate only (`is_active = false`), never delete, keeping history intact.","(d) Leave it — I know what I am doing."],"recommendation":"(b) if deletion must exist, (a) as the minimum viable guard today. Worth also checking what happens to an `overflow_wallet_id` pointing at the deleted wallet and to that wallet's `income_distribution_rules` rows — if those are not FK-cascaded, deletion leaves dangling references that will misroute a future capped overflow.","skip":""},{"id":"Q-084","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Overflow targets","priority":"SHOULD","context":"A capped wallet fills to `cap_max` at 100%, reduces the excess to `cap_reduction_rate`, and sends the overflow to `overflow_wallet_id` or, failing that, Unallocated (`distributeIncome.js:34`). The overflow target is deliberately restricted to non-capped wallets so it cannot itself be at max (§7). But nothing stops the target wallet from being deleted (Q-083), after which the overflow silently falls back to Unallocated.","question":"What should happen when a capped wallet's overflow target is deleted?","why":"The restriction prevents the capped-to-capped case but not the deleted-target case, and the silent fallback means a plan changes without anyone being told.","options":["(a) Fine as is — the Unallocated fallback is always a correct destination.","(b) Warn at wallet-delete time if the wallet is any other wallet's overflow target.","(c) Block deleting a wallet that is an overflow target."],"recommendation":"(b). Same family as Q-083 and almost certainly the same piece of work — one pre-delete check that looks at balance and inbound references together.","skip":""},{"id":"Q-085","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Time-boxed budgets","priority":"SHOULD","context":"A 'budget' in this app is a column on a wallet (`wallets.budget`), not an object with a date range. `budget_allocations` exists with `valid_from` and `valid_until` and 0 rows (Q-057), which suggests time-boxed budgets were designed once and abandoned. Every budget comparison in `dashboardCalcs` and `budgetPlan` reads the single number.","question":"Do you want budgets that change over time — a different grocery budget in December — or is one number per wallet correct?","why":"It is the difference between keeping `budget_allocations` and dropping it, and it is a significant feature if wanted: it would touch the Budgeting page, the wallet cards, the dashboard's overspent and underfunded calculations, and the capped mechanic's `cap_max >= budget` CHECK.","options":["(a) One number per wallet is correct — drop the table.","(b) I want per-month budgets.","(c) I want a way to temporarily override a budget without changing the plan."],"recommendation":"(a). The wallet model already handles 'more money this month' by letting the balance accumulate; a time-boxed budget adds a second, competing notion of the same idea and would need reconciling with `cap_max` everywhere.","skip":""},{"id":"Q-086","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Dashboard purpose","priority":"MUST","context":"`docs/dashboard-recon.md` §5 — the dashboard is currently 'a vertical list of six co-equal blocks' with no hero, no top-line summary, and the design spec's 'one hero number per screen' rule violated. The Wallets page has a `SummaryStrip`; the Dashboard does not. The recon names the 30-day projection as the strongest existing idea because it answers 'will I dip negative before payday'.","question":"What should the first screen tell you in one glance?","why":"The questionnaire spec is right that this question drives the dashboard rebuild entirely — every other dashboard decision (what to cut, what to promote, what the hero number is) follows from it, and Q-070's scope depends on the answer.","options":["(a) Total balance and what is freely spendable right now.","(b) Will I dip negative before payday — the 30-day projection.","(c) What needs my attention (overdue, overspent, stalled plans).","(d) How this month is going versus usual."],"recommendation":"(b) as the hero, with (a) as a summary strip above it. The recon reached the same conclusion independently, and (c) is a better fit for a banner than a hero — attention items are episodic, and a hero that is usually empty is a wasted hero.","skip":""},{"id":"Q-087","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Freely spendable","priority":"SHOULD","context":"'Freely spendable' is computable today but needs a definition decision (`docs/dashboard-recon.md` §2b). The candidate proposed there: the sum of `type='variable'` wallet balances plus the Unallocated balance, excluding fixed and investment as earmarked.","question":"Is that the right definition of freely spendable?","why":"If a summary strip is added (Q-086), this number sits on it, and a wrong definition is worse than no number — it is the figure you would act on.","options":["(a) Variable plus Unallocated, as proposed.","(b) Unallocated only — everything already in a wallet is assigned.","(c) Variable plus Unallocated, minus the remaining budgeted commitments this month."],"recommendation":"(a). (b) is arguably purer but would usually read as a small number sitting next to a large total, which confuses more than it clarifies; (c) is more accurate and much harder to explain on a card with an eleven-pixel label.","skip":"Only relevant if Q-086 includes (a)."},{"id":"Q-088","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Plan stalls","priority":"SHOULD","context":"When more than one Unallocated plan is eligible at once, `evaluateUnallocatedPlans` (`src/lib/unallocatedPlans.js:72`) fires nothing, persists an `unallocated_pending_conflicts` row with a balance snapshot, and stalls until the user resolves it in `UnallocatedConflictBanner`. While a conflict is pending, **nothing auto-fires ever** — and if the eligible set is still ambiguous, the snapshot is simply refreshed.","question":"Is a permanent stall the right behaviour, or should a pending conflict expire or escalate?","why":"A conflict left unresolved silently disables the entire automatic-distribution system indefinitely. The only signal is a banner on the dashboard and the Unallocated page.","options":["(a) Permanent stall is right — it is refusing to guess with money.","(b) Stall, but escalate the surface after N days.","(c) Stall only the conflicting plans; let non-conflicting plans keep firing."],"recommendation":"(a). (c) sounds reasonable and quietly reintroduces exactly the guessing the design refuses — 'non-conflicting' is a judgement about which plans compete, which is the thing the code deliberately declines to make. If plan firings get a log (Q-003) and stalls get history (Q-058), the stall becomes visible enough without changing the behaviour.","skip":""},{"id":"Q-089","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Reconciliation","priority":"SHOULD","context":"Both import reconciliation checks are soft. `src/lib/import/reconcile.js:3-5`: 'BOTH CHECKS ARE SOFT. They warn; they never block the import and never drop a row… a real statement that trips a check is still the best record of what happened.' The chain check names the first row where the file and the parse disagree; the drift check compares a stored boundary balance against a newly derived one.","question":"Should any reconciliation failure ever block a commit?","why":"A chain break means the parse disagrees with the bank's own running balance — which usually means a layout drift or a mis-parsed amount, i.e. the import is wrong rather than the statement.","options":["(a) Warn-only, permanently — lock the decision and stop revisiting it.","(b) Warn by default, but block when the chain break exceeds a threshold.","(c) Block on a chain break, warn on drift."],"recommendation":"(a), per the decision log's reasoning — but only because the preview shows every parsed row before commit and nothing is auto-committed. If a 'commit without preview' path is ever added, this answer must change, and that dependency is worth recording alongside the decision.","skip":""},{"id":"Q-090","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Recurring exclusions","priority":"SHOULD","context":"A row matching a saved recurring link is excluded from the commit entirely; a first encounter always asks; an unanswered question blocks the import. The design is deliberately conservative because 'a wrong auto-exclude silently loses a real spend, which is worse than a missed match' (§7). But once links are saved, month two is silent by design.","question":"Should there be a way to review what a link excluded, after the fact?","why":"The conservative design means the residual failure mode is silent omission, and there is currently no screen that says 'these four rows were skipped because of saved links'.","options":["(a) Yes — show excluded rows in the import result summary.","(b) Yes — a persistent view of saved links and what each has matched.","(c) No — the preview already shows them before commit."],"recommendation":"(a). It is the cheap half of (b) and it closes the one silent-loss path in an otherwise very careful pipeline. (c) is true today but stops being true the moment links make month two silent, which is the whole point of links.","skip":""},{"id":"Q-091","part":"B","section":"B3","sectionTitle":"Feature behaviour","topic":"Templates","priority":"SHOULD","context":"Income templates carry a full distribution (name, amount, note, `send_remainder` flag, and items) and are created two ways that produce identical templates. Unallocated templates are a deliberately separate pool, judged against the live balance with affordable ones on top. §7 records that a standalone 'distribution-only template' was tried and dropped.","question":"Is the two-pool split still right, and is there anything you want templates to do that they do not?","why":"Templates are the most-used convenience feature in the app by design, and this is one of the few places the docs record something being tried and abandoned — worth confirming that conclusion held up in use.","options":["(a) Still right, nothing missing.","(b) Still right, but templates should do something specific which I will name.","(c) Merge the pools."],"recommendation":"(a). The pools have genuinely different shapes — one carries an amount, the other is judged against a live balance — and merging them would require inventing a common notion of 'amount' that neither wants.","skip":""},{"id":"Q-092","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Is the system final","priority":"MUST","context":"`DESIGN-SPEC.md` is described as locked, approved 2026-07-09 ('direction B structure × direction C warmth'), and enforced by the `design-check` skill. The audit confirmed near-total compliance: every token value in `src/index.css` matches the spec exactly, zero `font-bold`/`font-semibold` anywhere in `src/`, every euro rendered through `formatMoney()`, all charts inline SVG, with one four-class exception in `App.jsx` (Q-037).","question":"Is 'the blend' the final visual answer, or a stage you would move on from?","why":"Everything else in B4 follows from this. It also decides whether the dashboard rebuild is a content exercise inside a fixed system, or an opportunity to change the system — which are very different amounts of work.","options":["(a) Final — the system is right; only content and layout change from here.","(b) Mostly final, but I want to revisit something specific.","(c) It was a stage — I would like to explore a different direction."],"recommendation":"(a). The system is unusually well executed and the near-total compliance rate suggests it is not fighting you. If (c), that is a chat-first design phase in its own right and should be scheduled as one rather than folded into the dashboard rebuild.","skip":""},{"id":"Q-093","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Page-by-page verdict","priority":"SHOULD","context":"Nine screens exist: Dashboard, Wallets, WalletDetail, Income, IncomeRecurringDetail, Budgeting, Import, Settings, Login/ResetPassword. Only the Dashboard has a recon naming concrete problems. WalletDetail carries four behaviours in one page including an empty investment card. Import is the newest and has never been used on real data. Settings was rebuilt in the density pass to a 640px grouped layout.","question":"Page by page — is each layout final, does it need rework, or is it a placeholder?","why":"It is the cheapest way to turn 'the app is fine' into a specific work list, and it stops the dashboard rebuild silently becoming an app-wide redesign.","options":["(Mark each of the nine: final / rework / placeholder.)"],"recommendation":"From the artefacts I would expect Dashboard = rework, WalletDetail = rework (the investment branch at minimum), and everything else = final. Correct me — you are the only one who has used them.","skip":""},{"id":"Q-094","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Likes and dislikes","priority":"SHOULD","context":"§7 records two aesthetic preferences directly: you disliked the colour picker, which is why wallet identity became the icon; and the mockup's per-wallet rainbow was dropped for one coral identity plus green metric bars, because colour was no longer user-editable.","question":"What do you actively like in the current UI, and what do you dislike?","why":"Likes are as useful as dislikes and much harder to infer from code. A rebuild that removes something you liked is worse than no rebuild at all, and the two recorded preferences above are both dislikes — nothing in the repo records what you wanted kept.","options":["(Free text.)"],"recommendation":"None.","skip":""},{"id":"Q-095","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Reference apps","priority":"SHOULD","context":"The system is described as 'Monarch-style' in places and as 'direction B structure × direction C warmth' in `DESIGN-SPEC.md`. Monarch Money is the only external reference named anywhere in the repository.","question":"Are there apps whose look or information design you want to move toward?","why":"One reference app resolves more layout questions than ten paragraphs of specification, particularly for the dashboard, where the open question is hierarchy rather than styling.","options":["(Free text.)"],"recommendation":"None — but if Monarch is still the reference, say so explicitly, because its dashboard is exactly the 'summary strip plus one hero' shape Q-086 recommends, and that would settle Q-086 and Q-070 together.","skip":""},{"id":"Q-096","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Density","priority":"SHOULD","context":"`DESIGN-SPEC.md` §8 locked six density rules in July: hero 22px plus metric bar plus caption plus a real footer line (no empty card bottoms); a summary strip under each page header; dense tables with `even:bg-field` zebra and 'Showing X of Y'; `CompactRow` for repeated items; a 640px grouped Settings layout; ghost dashed add-cards filling grid remainders. They are implemented once as shared primitives in `src/components/ui/`.","question":"Is the density right, too dense, or not dense enough?","why":"Density is the hardest thing to change later because it is encoded in shared primitives used on every page. If it is wrong, that should surface before the dashboard rebuild reuses those primitives (which the recon explicitly requires it to).","options":["(a) Right.","(b) Too dense — more breathing room.","(c) Not dense enough — more per screen."],"recommendation":"No recommendation — this is pure preference, and the spec already encodes a deliberate choice you made after seeing mockups.","skip":""},{"id":"Q-097","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Navigation","priority":"SHOULD","context":"Navigation is a fixed 224px sidebar (`src/components/Layout.jsx:35`) with five items — Dashboard, Wallets, Income, Import, Budgeting (`:6-12`) — plus Settings, a privacy toggle and sign-out. It does not collapse at any viewport width.","question":"Should navigation change — more items, grouping, or a collapse control?","why":"Five items is comfortable and needs no grouping. The real constraint is the fixed width, which is also the blocker for any mobile work (Q-101), so this question and that one are the same piece of work.","options":["(a) No change.","(b) Add a collapse toggle.","(c) Restructure — I will say how."],"recommendation":"(b), but only if Q-101 says mobile matters. On desktop alone, five items in a fixed rail is the right answer and a collapse control is a button nobody presses.","skip":"Answer after Q-101."},{"id":"Q-098","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Dark mode","priority":"NICE","context":"Dark mode works by `.dark` overriding the same CSS variables, so almost no component contains a `dark:` utility at all (`docs/audit/UNDERSTANDING.md` §5). It is applied from `settings.theme` and re-fetched on every auth state change (`App.jsx:64`). Every UI verification in this project is a both-theme sweep.","question":"Do you actually use dark mode, and should it follow the OS rather than a stored preference?","why":"It doubles the verification cost of every UI change. If it is never used, that is worth knowing; if it is used, following the OS is a small addition that removes a setting.","options":["(a) I use it; the stored preference is right.","(b) I use it; it should follow the OS.","(c) I never use it."],"recommendation":"(a) or (b). Do not drop it even if (c) — the token architecture makes it nearly free to maintain, and the cost is in verification habits rather than code.","skip":""},{"id":"Q-099","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Money presentation","priority":"NICE","context":"`formatMoney()` produces `€ 1.234,56` with a normal space after the euro sign and U+2212 for negatives, hand-rolled for deterministic output and covered by 15 tests. `formatMoneyCompact()` produces `€500` / `€1.5k` for charts. `DESIGN-SPEC.md` §3 already permits de-emphasising decimals on hero numbers.","question":"Is the money presentation right — the space after `€`, the compact `k` form, two decimals everywhere?","why":"It appears on literally every screen and is the one formatting decision that is expensive to revisit once charts, tables, tests and the design spec all encode it.","options":["(a) Right as is.","(b) Drop or de-emphasise decimals on large and summary numbers.","(c) Something else, which I will name."],"recommendation":"(a), with (b) worth considering for the dashboard hero specifically — the spec already allows it, and a 36px number with cents reads as more precision than the projection actually has.","skip":""},{"id":"Q-100","part":"B","section":"B4","sectionTitle":"Visual direction and layout","topic":"Empty and sparse states","priority":"NICE","context":"Empty states are specified as 'no card, centred both axes on the page bg, `ink-muted` headline plus `ink-faint` support line', with a boxed empty-state card called a violation (`DESIGN-SPEC.md` §7). The dashboard's is the bare string 'Nothing here yet'. The 'Over time' charts have no low-data state at all and render mostly empty with under a year of history (`docs/dashboard-recon.md` §4-5).","question":"How much do empty and sparse states matter?","why":"On a personal tool with a populated account, almost never — except that the test account is thin (Q-030), so every screenshot you or an agent takes shows them, and they are what any future reviewer would see first.","options":["(a) Low priority — I will never see them again.","(b) Worth doing properly as part of the dashboard rebuild.","(c) Worth doing now."],"recommendation":"(b), scoped to the sparse-data case specifically. That is the one that looks broken rather than empty — an axis with one bar reads as a bug, while 'Nothing here yet' reads as intentional.","skip":""},{"id":"Q-101","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Mobile","priority":"MUST","context":"The app shell is `flex h-screen overflow-hidden` with a fixed `w-56 shrink-0` sidebar and no hamburger or collapse anywhere (`src/components/Layout.jsx:33-35`). At 390px the sidebar still consumes 224px, leaving content in roughly a 150px strip. `docs/dashboard-recon.md` §3 calls this out directly: 'any mobile-aware redesign must address this at the shell level, not just the dashboard.'","question":"Is a mobile or responsive experience wanted, and at what priority?","why":"This is a personal-finance app, which is fundamentally a phone use case — check a balance, log a spend, tick off a payment. If mobile matters at all, it is a shell-level change that must come **before** the dashboard rebuild, not after, because every layout decision in that rebuild depends on it. Rebuilding the dashboard first and then making it responsive means designing it twice.","options":["(a) Desktop only, permanently — I only use this at a computer.","(b) Responsive, and it is a priority — do the shell before the dashboard.","(c) Responsive eventually, after the dashboard.","(d) A dedicated mobile view or PWA."],"recommendation":"(b) if you would ever log a spend from your phone. The order matters more than the effort here. If (a), skip Q-102 and Q-103, and Q-097 becomes (a).","skip":""},{"id":"Q-102","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Load performance","priority":"SHOULD","context":"The main JS chunk is 732 kB (190 kB gzipped) and the pdf.js worker 1.26 MB; only the `Import` route is code-split (`src/App.jsx:102`). Build emits one warning about chunks over 500 kB.","question":"If mobile matters, does first-load performance on mobile data matter enough to code-split further?","why":"190 kB gzipped before first paint is unremarkable on wifi and noticeable on a slow connection. But this is a returning-user app on a known device, so caching covers most of it.","options":["(a) Yes — split the heavier routes.","(b) No — caching covers a returning-user app.","(c) Only if it actually feels slow in use."],"recommendation":"(c). Measure before splitting; the same person on the same device loads this repeatedly, which is the best case for caching.","skip":"Skip if Q-101 is (a)."},{"id":"Q-103","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Mobile scope","priority":"SHOULD","context":"Some flows are phone-shaped and some are not. Realistically phone-shaped: logging a variable spend, ticking off a recurring payment, checking balances, and the privacy toggle. Not phone-shaped: the Budgeting flow diagram, the Import preview table, and `DistributionPopup`'s dual side-by-side progress bars with per-row euro/percent toggles.","question":"If mobile matters, which flows must work on a phone — and which may stay desktop-only?","why":"It turns 'make it responsive' into a bounded piece of work rather than an app-wide rewrite, and it gives the shell change a clear acceptance test.","options":["(a) Endorse the split above — the four phone flows work, Import and Budgeting say 'open this on a bigger screen'.","(b) Everything must work on a phone.","(c) A different split, which I will describe."],"recommendation":"(a). Import and Budgeting can legitimately show a 'use a larger screen' message; forcing a 42-row preview table onto 390px produces something nobody would use anyway.","skip":"Skip if Q-101 is (a)."},{"id":"Q-104","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Offline","priority":"SHOULD","context":"The app is a pure SPA against Supabase with no service worker, no caching layer and no offline handling. Every page fetches on mount, and every write assumes a live RPC round trip.","question":"Does offline behaviour matter at all?","why":"For a phone use case, 'log a spend while offline' is the obvious want — and it is the one feature that would fundamentally change the write architecture, because a queue-and-sync layer sits on top of a money model whose writes are currently non-atomic.","options":["(a) No — online only.","(b) Read-only offline — see balances from a cache.","(c) Offline writes with sync."],"recommendation":"(a). (c) is comfortably the most expensive thing anyone could add to this project: it means reconciling queued balance changes against a database that may have moved, on paths that do not yet have transactions.","skip":""},{"id":"Q-105","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Custom domain","priority":"NICE","context":"Deployed on Vercel from `main` with an SPA rewrite in `vercel.json`. No custom domain appears anywhere in the repo or config.","question":"Is a custom domain wanted?","why":"Purely cosmetic unless Q-065 is (b) or (c), in which case a `*.vercel.app` URL is friction for anyone you share it with — and a bookmarked deployment URL is fragile.","options":["(a) No.","(b) Yes.","(c) Only if other people use it."],"recommendation":"(c).","skip":""},{"id":"Q-106","part":"B","section":"B5","sectionTitle":"Platform and reach","topic":"Free tier","priority":"SHOULD","context":"`PROJECT-CONTEXT.md` §8 puts the Supabase free-tier ceiling at roughly 200–250 active users, egress-bound. Email verification runs through Resend. Vercel hosting is free at this scale.","question":"Is staying on the free tier a constraint you want honoured in design decisions?","why":"It interacts with Q-062 and Q-065. If the answer is 'free tier forever', fetch-everything is fine permanently and there is no reason to build for scale anywhere — which removes a whole class of premature decisions from every future phase.","options":["(a) Yes — free tier is a hard constraint.","(b) No — I would pay if needed.","(c) Free tier, but I want to know before I cross a limit."],"recommendation":"(a) for a personal tool. Designing explicitly for one user and stopping all thought about scale is a genuine simplification, not a compromise.","skip":""},{"id":"Q-107","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Encryption conviction","priority":"MUST","context":"The encryption plan accepts two costs in its own words: loss of database-side atomicity on balance updates ('a real downgrade from a provable guarantee to a probabilistic one') and no database-side computation, filtering or sorting on encrypted fields. §7 records the stance as 'desirable to the owner (cares about data privacy) but accepted as a large, later project' — written before the app had six non-atomic money paths and four atomic RPCs holding its guarantees.","question":"How strongly do you actually feel about the encryption ambition, given that cost?","why":"This single answer determines whether the money layer moves toward the database or away from it, and therefore what Q-018, Q-038, Q-045 and Q-046 should be. The trade-off has changed since the stance was recorded.","options":["(a) Strongly — it is the point, accept the cost.","(b) It matters, but not at that price.","(c) It was aspirational rather than a commitment."],"recommendation":"Answer honestly rather than aspirationally — an aspirational yes here freezes several other decisions indefinitely. My read is (b), because you are the admin you would be hiding data from (Q-108). If (b) or (c), Q-072 should be (b), (c) or (d).","skip":"Skip if Q-072 is (c) or (d)."},{"id":"Q-108","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Admin visibility","priority":"SHOULD","context":"`PROJECT-CONTEXT.md` §5 — 'Admin visibility is intentional: the Supabase dashboard / service role bypasses RLS and can see all data. Protection is between users, not from the owner.' The mitigation recorded is to keep the Supabase account well-secured with 2FA.","question":"Is admin-visible data acceptable indefinitely?","why":"It is only a problem if other people use the app (Q-065). For a single user, the admin and the user are the same person, and encryption would protect against nothing except a Supabase-side breach.","options":["(a) Yes, acceptable — I am the only user.","(b) Acceptable now, not if others use it.","(c) Not acceptable — this is exactly why encryption matters."],"recommendation":"(a) or (b). If (b), note that the trigger is other people joining — which makes encryption a prerequisite of growth rather than a phase in its own right, and therefore something to schedule against Q-065 rather than against the calendar.","skip":""},{"id":"Q-109","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"What is sensitive","priority":"SHOULD","context":"What this database actually holds: wallet names, transaction notes and counterparty names taken from real bank statements, amounts, balances, and an `account_iban` on `monthly_balance_snapshots`.","question":"Which of those do you consider genuinely sensitive?","why":"It scopes any partial-encryption option (Q-072 (b)) and tells us whether the sensitivity lives in the *amounts* or in the *narrative* — who you paid and for what. The two have very different costs to encrypt, because only one of them is summed, sorted and compared by the database.","options":["(a) Amounts and balances.","(b) The narrative — notes, counterparty names, wallet names.","(c) Both equally.","(d) The IBAN specifically."],"recommendation":"If (b), partial encryption becomes genuinely attractive: names and notes are never aggregated or filtered by the database, so encrypting them costs nothing architecturally and the balance RPCs survive untouched. That is the version of this feature actually worth building.","skip":"Skip if Q-072 is (c) or (d)."},{"id":"Q-110","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Backup guarantee","priority":"MUST","context":"There is no export today. Free-tier Supabase backup guarantees are limited, and the app's own two-tier reset can wipe an account from the Settings danger zone behind an OTP confirmation.","question":"What must the backup story guarantee — and is your data backed up in any form right now?","why":"It sets the bar for Q-071 and Q-081. 'I could rebuild it from my bank statements' is a legitimate answer that lowers the priority considerably; 'I would lose months of categorisation' raises it sharply.","options":["(a) Nothing — I could rebuild it.","(b) I want a file I control, on demand.","(c) I want automatic periodic backups I do not have to remember."],"recommendation":"(b). (c) is meaningfully harder — where do they go, who stores them, what reminds you — and the plan's 'gentle periodic reminder to export' is the pragmatic middle ground between the two.","skip":""},{"id":"Q-111","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Account deletion","priority":"SHOULD","context":"Account deletion was explicitly out of scope for settings phase 1 because it needs an edge function (`PROJECT-CONTEXT.md` §6.3). 'Full reset' removes a user's data but leaves their auth account in place.","question":"Does account deletion need to exist?","why":"If other people ever use the app (Q-065), it is table stakes and arguably a legal expectation. If not, it is dead weight and an edge function to maintain.","options":["(a) No — not needed.","(b) Yes, if others use it.","(c) Yes regardless."],"recommendation":"(b). Tie it to Q-065 rather than building it speculatively — an edge function is the only server-side code this project would have, and that is a real maintenance surface to add for nobody.","skip":""},{"id":"Q-112","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Open signup","priority":"NICE","context":"Signup is open with email verification via Resend, and the success message is deliberately worded to avoid confirming whether an email is already registered (an anti-enumeration choice recorded in §5). There is no admin UI to see or remove users.","question":"Should signup stay open?","why":"An open signup on a free tier with a user ceiling is an invitation for a stranger to consume your quota, and it is the only unauthenticated write path in the app.","options":["(a) Close it — invite or allowlist only.","(b) Leave it open.","(c) Leave it open but cap it."],"recommendation":"(a) if Q-065 is (a). Nothing is gained by open signup on a personal tool, and the anti-enumeration wording that had to be designed around it stops being necessary.","skip":""},{"id":"Q-113","part":"B","section":"B6","sectionTitle":"Data, privacy and trust","topic":"Test/real separation","priority":"NICE","context":"The test account's credentials live in `.env.test.local` (gitignored via `*.local`), and `CLAUDE.md` requires browser automation to use it rather than the owner's real account, with `db-verifier` checks scoped to that account's `user_id`. Both accounts live in the **same** Supabase project and database.","question":"Is the current separation between test and real data sufficient, or do you want a separate project for testing?","why":"A destructive mistake scoped to the wrong `user_id` is one query away, and the `reset_user_data` RPC exists precisely to be called. RLS protects users from each other, not an agent holding the owner's session from the owner's own data.","options":["(a) Sufficient — RLS and the discipline are enough.","(b) A separate Supabase project for testing.","(c) Sufficient, but no agent may ever call `reset_user_data`."],"recommendation":"(c) as an immediate rule — it costs nothing and closes the one genuinely irreversible call. (b) becomes cheap only if Q-060 produces a baseline migration; without one, a second project cannot be created from the repo at all.","skip":""},{"id":"Q-114","part":"B","section":"B7","sectionTitle":"Collaboration","topic":"Second developer","priority":"MUST","context":"`CLAUDE.md` was rewritten single-maintainer on 2026-09-14 (audit block D-16, option b). `origin/WOUTER` is 67 commits behind `main` and 0 ahead, last commit 2026-06-24; `woholvoe` has 6 of 86 commits on `main`, none since June; **no `f/` branch has ever existed**. `OPEN-QUESTIONS.md` Q2 keeps the question open in case that changes.","question":"Is the second developer coming back, and does anything in the roadmap depend on them?","why":"The decision was already taken in the docs, but the register still carries it. The answer determines whether the branch convention, the collaborator setup section and `origin/WOUTER` should be restored, kept, or removed — and whether the PR discipline in Q-115 is a review mechanism or a solo checklist.","options":["(a) No — single maintainer permanently. Delete `origin/WOUTER` and close Q2.","(b) Possibly — keep the question open.","(c) Yes, and I will say what they own."],"recommendation":"(a) unless you know otherwise. Two of the three artefacts describing the collaboration are already stale, and a stale branch on the remote is the kind of thing someone eventually tries to merge.","skip":""},{"id":"Q-115","part":"B","section":"B7","sectionTitle":"Collaboration","topic":"PR discipline","priority":"SHOULD","context":"Branch-plus-PR discipline is enforced by habit plus a PreToolUse Bash guard, because branch protection is unavailable on the free plan. All 18 of the project's PRs were opened and merged by the same person.","question":"With one maintainer, does the PR discipline still earn its overhead?","why":"A PR you open and merge yourself is a checklist rather than a review. The value it genuinely provides here is real but specific: CI runs on it, and it produces the diff the `code-reviewer` agent reads. Worth stating that explicitly rather than assuming the habit is self-justifying.","options":["(a) Keep it — the CI gate and the reviewable diff are the point.","(b) Keep it, but allow small doc-only changes direct to `main`.","(c) Drop it."],"recommendation":"(a). The guard hook already blocks the alternative, and every incident recorded in §8 involves a merge. (b) sounds harmless and is how 'just this once' starts.","skip":""},{"id":"Q-116","part":"B","section":"B7","sectionTitle":"Collaboration","topic":"Audit artefacts","priority":"NICE","context":"`docs/audit/` holds the six-session artefacts permanently after this operation ends — about 4,300 lines across ten markdown files plus three HTML interfaces. `PROJECT-CONTEXT.md` §9 lists it under 'living reference'.","question":"After this questionnaire is answered, what happens to `docs/audit/` — living reference, partial archive, or archive it all?","why":"Its value drops sharply once its findings are folded into `PROJECT-CONTEXT.md`, `OPEN-QUESTIONS.md` and the roadmap — and a stale audit is exactly the kind of document this whole operation existed to eliminate.","options":["(a) Keep as-is — it is the reasoning behind the current structure.","(b) Keep `UNDERSTANDING.md` and this questionnaire; archive the rest.","(c) Archive all of it once the answers are folded in."],"recommendation":"(b). `UNDERSTANDING.md` is the only artefact that would take a fresh reader a full session to reproduce; `INVENTORY.md` in particular starts going stale the moment anyone commits.","skip":""},{"id":"Q-117","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Review boundary","priority":"MUST","context":"This operation ran six sessions with a human approval gate on every consequential change, via decision files with explicit `ok` / `no` / `defer` markings; three sessions were read-only by construction. The guard hook blocks six specific destructive commands deterministically. The A-list that follows ranges from 'fix four Tailwind classes' (Q-037) to 'rewrite the money layer as RPCs' (Q-018).","question":"Which categories of the remaining work do you want to review before they land, and which can run unsupervised?","why":"Treating everything identically means either over-reviewing trivia or under-reviewing money. A rule that maps onto the directory structure is enforceable; a rule that maps onto judgement is not.","options":["(a) Review everything, as now.","(b) Unsupervised for docs, tests, styling and lint; reviewed for anything touching `src/lib/` money modules, schema, or RPCs.","(c) Unsupervised for anything with test coverage; reviewed for anything without.","(d) Something else, which I will describe."],"recommendation":"(b), with (c)'s test-coverage rule as a secondary filter. It maps cleanly onto directories, which makes it something a hook or a `CLAUDE.md` rule can actually express.","skip":""},{"id":"Q-118","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Schema gate","priority":"MUST","context":"`CLAUDE.md` rule 3 and the `db-migration` skill gate schema changes: Claude Code drafts SQL, the owner applies it, verification afterwards is read-only. The audit's live-DB pass respected this — SELECT only, no writes. The rule exists because the original multi-user migration was *assumed* applied and silently never ran, breaking isolation and account deletion until it was run by hand (§8).","question":"Does that gate stay exactly as it is?","why":"Several recommendations in this file need migrations — Q-011, Q-018, Q-024, Q-032, Q-057, Q-060. If the gate stays, each is a two-step with a human in the middle, which shapes how they should be batched into as few owner interventions as possible.","options":["(a) Unchanged — draft, owner applies, verify after.","(b) Allow autonomous application against a Supabase *branch*, never production.","(c) Relax for additive changes only (new column, new index), never for drops or function replacement."],"recommendation":"(a), and possibly (b) once Q-060 gives the repo a baseline migration. The rule is scar tissue from a real incident, and nothing in the remaining work is urgent enough to justify removing it.","skip":""},{"id":"Q-119","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Guard coverage","priority":"SHOULD","context":"The PreToolUse Bash guard (`.claude/scripts/guard-bash.cjs`) deterministically blocks force-push, push to `main`, recursive force-delete, `npm audit fix --force`, destructive SQL, and hard reset/clean. It is a substring guard, so a command that merely mentions a blocked pattern is also blocked — test payloads must go via a file.","question":"Is anything missing from that list, given the work that remains?","why":"The remaining work includes migrations, a possible schema dump, dependency bumps and a seed script. My candidates: `supabase db reset`, any `DROP` outside a reviewed migration file, `git push --delete`, and installing a new dependency without asking.","options":["(a) Add all four.","(b) Add only the Supabase ones.","(c) The list is fine as it is."],"recommendation":"(a) minus the dependency one, which works better as a stated `CLAUDE.md` rule than a hard block — a blocked `npm install` is confusing mid-task, whereas a stated rule is simply followed.","skip":""},{"id":"Q-120","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Test-account writes","priority":"SHOULD","context":"Browser testing always logs in with the test account from `.env.test.local`, never the owner's real account, and `db-verifier` checks are scoped to that account's `user_id` (`CLAUDE.md`). Q-030 recommends a seed script, which is a write.","question":"What may an agent do to the test account unattended — and may it seed data?","why":"Without an explicit answer, the seed script either never gets written or gets run without permission. Both outcomes are worse than deciding now.","options":["(a) Full freedom on the test account, including seeding and resets.","(b) May seed and read; may not call `reset_user_data`.","(c) Read-only — every write asked for first."],"recommendation":"(a) for the test account specifically, provided `.env.test.local` is the only credential source used and nothing ever touches the owner's `user_id`. The point of a test account is that it is expendable; (c) makes Q-030 impossible in practice.","skip":""},{"id":"Q-121","part":"B","section":"B8","sectionTitle":"Working style and autonomy","topic":"Gates and skills","priority":"SHOULD","context":"The project has two custom subagents (`code-reviewer`, `db-verifier`) and four skills (`db-migration`, `design-check`, `verify-merge`, `wrapup`). `CLAUDE.md` mandates `code-reviewer` before declaring a feature done, `verify-merge` after any merge, and `wrapup` at the end of every session. This audit exercised all of them repeatedly.","question":"Are those gates working, and is any of them ceremony you would drop?","why":"`wrapup` in particular is the habit the entire status model now depends on — §6 is the single source of status precisely because `wrapup` already updates it. If that habit lapses, the structure the audit just built decays within weeks.","options"
