<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financieel — Audit questionnaire</title>
<style>
:root{
  --cream:#F4F0E7; --card:#FFFFFF; --card-border:#E4DFD3; --inner-border:#ECE7DB;
  --field:#F7F4EC; --track:#F1EFE8;
  --ink:#2C2C2A; --ink-soft:#5F5E5A; --ink-muted:#888780; --ink-faint:#B4B2A9;
  --accent:#D85A30; --accent-solid:#D85A30;
  --positive:#3B6D11; --positive-tint:#EAF3DE; --positive-bar:#639922;
  --negative:#993C1D; --negative-tint:#FAECE7; --negative-bar:#E24B4A;
  --warning:#EF9F27; --warning-tint:#FAEEDA;
  --shadow:0 1px 2px rgba(44,44,42,.04);
}
html[data-theme="dark"]{
  --cream:#14140F; --card:#1E1E17; --card-border:#2C2C2A; --inner-border:#2C2C2A;
  --field:#14140F; --track:#2C2C2A;
  --ink:#F1EFE8; --ink-soft:#B4B2A9; --ink-muted:#888780; --ink-faint:#5F5E5A;
  --accent:#F0997B; --accent-solid:#D85A30;
  --positive:#97C459; --positive-tint:rgba(99,153,34,.18); --positive-bar:#639922;
  --negative:#F09595; --negative-tint:rgba(226,75,74,.15); --negative-bar:#E24B4A;
  --warning:#EF9F27; --warning-tint:rgba(239,159,39,.16);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font:400 14px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--field);border:1px solid var(--inner-border);border-radius:5px;padding:.05em .32em}
strong{font-weight:500}
em{font-style:italic;color:var(--ink-soft)}

/* ── shell ───────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--card-border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 16px}
main{flex:1;min-width:0;padding:24px 28px 120px;max-width:900px}
@media (max-width:860px){
  .shell{display:block}
  aside{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--card-border)}
  main{padding:18px 16px 120px}
}

.brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.mark{width:26px;height:26px;border-radius:9px;background:var(--accent-solid);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:500}
.brand h2{font-size:14px;font-weight:500;margin:0;letter-spacing:-.01em}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:500;margin:18px 0 7px}

.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;border-radius:9px;
  border:none;background:none;color:var(--ink-muted);font-size:12.5px;cursor:pointer;margin-bottom:1px;font-family:inherit}
.navitem:hover{background:var(--track)}
.navitem.active{background:var(--ink);color:var(--cream);font-weight:500}
.navitem .frac{margin-left:auto;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--positive-bar);flex-shrink:0}
.navitem .dot.part{background:var(--ink-faint)}

.filters{display:flex;flex-direction:column;gap:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;padding:4px 2px}
.chk input{accent-color:var(--accent-solid);width:14px;height:14px;margin:0}

/* ── header ──────────────────────────────────────────────────────── */
h1{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--ink-muted);font-size:13px;margin:0 0 16px}
.hairline{height:1px;background:var(--card-border);margin:16px 0 20px}

.progwrap{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.progbar{flex:1;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.progbar>div{height:100%;background:var(--positive-bar);width:0;transition:width .2s}
.progtext{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
.btn{border:1px solid var(--card-border);background:var(--card);color:var(--ink-soft);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:var(--track)}
.btn.primary{background:var(--ink);color:var(--cream);border-color:var(--ink);font-weight:500}
.btn.primary:hover{opacity:.9;background:var(--ink)}
input[type=search]{flex:1;min-width:160px;border:1px solid var(--card-border);background:var(--field);color:var(--ink);
  border-radius:9px;padding:6px 11px;font-size:12.5px;font-family:inherit}
input[type=search]:focus{outline:2px solid var(--accent-solid);outline-offset:-1px}

/* ── cards ───────────────────────────────────────────────────────── */
.sechead{margin:30px 0 12px}
.sechead h3{font-size:17px;font-weight:500;margin:0 0 2px;letter-spacing:-.01em}
.sechead p{margin:0;font-size:12px;color:var(--ink-muted)}

.q{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:14px}
.q.focused{outline:2px solid var(--accent-solid);outline-offset:1px}
.q.done{border-color:var(--positive-bar)}
.q.skipped{opacity:.5}
.q.hidden{display:none}

.qtop{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:10px}
.qid{font-size:13px;font-weight:500;letter-spacing:-.01em}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:2px 7px;border-radius:99px;border:1px solid transparent}
.badge.MUST{background:var(--negative-tint);color:var(--negative)}
.badge.SHOULD{background:var(--warning-tint);color:#854F0B}
html[data-theme="dark"] .badge.SHOULD{color:var(--warning)}
.badge.NICE{background:var(--track);color:var(--ink-muted)}
.badge.sec{background:var(--field);color:var(--ink-muted);border-color:var(--inner-border)}
.badge.start{background:var(--positive-tint);color:var(--positive)}
.badge.think{background:var(--warning-tint);color:#854F0B}
html[data-theme="dark"] .badge.think{color:var(--warning)}
.badge.ok{background:var(--positive-tint);color:var(--positive)}
.qtop .spacer{margin-left:auto}

.qtext{font-size:15px;font-weight:500;margin:0 0 12px;letter-spacing:-.01em;line-height:1.45}
.block{margin:0 0 11px;font-size:13px;line-height:1.62;color:var(--ink-soft)}
.block .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:500;display:block;margin-bottom:3px}
.rec{background:var(--field);border:1px solid var(--inner-border);border-radius:11px;padding:11px 13px;margin:0 0 12px;font-size:13px;line-height:1.62;color:var(--ink-soft)}
.cond{background:var(--warning-tint);border:1px solid var(--inner-border);border-radius:11px;padding:9px 12px;margin:0 0 12px;font-size:12.5px;color:var(--ink-soft)}

.opts{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--card-border);background:var(--card);
  border-radius:11px;padding:8px 11px;cursor:pointer;font-size:13px;line-height:1.55;color:var(--ink-soft);
  text-align:left;font-family:inherit;transition:background .12s,border-color .12s}
.opt:hover{background:var(--track)}
.opt.on{border-color:var(--accent-solid);background:var(--field);color:var(--ink)}
.opt .num{flex-shrink:0;width:18px;height:18px;border-radius:6px;background:var(--track);color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}
.opt.on .num{background:var(--accent-solid);color:#fff}
.freehint{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin:0 0 10px}

textarea{width:100%;border:1px solid var(--card-border);background:var(--field);color:var(--ink);
  border-radius:11px;padding:10px 12px;font:400 13.5px/1.6 inherit;resize:none;overflow:hidden;min-height:76px;font-family:inherit}
textarea:focus{outline:2px solid var(--accent-solid);outline-offset:-1px}
.answerlabel{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:500;display:block;margin:0 0 5px}

.qfoot{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.mini{border:1px solid var(--card-border);background:none;color:var(--ink-muted);border-radius:8px;
  padding:4px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.mini:hover{background:var(--track)}
.mini.on{background:var(--warning-tint);border-color:var(--warning);color:#854F0B}
html[data-theme="dark"] .mini.on{color:var(--warning)}

/* ── intro + closing ─────────────────────────────────────────────── */
.panel{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:500;margin:0 0 9px;letter-spacing:-.01em}
.panel ol,.panel ul{margin:0;padding-left:20px;font-size:13px;line-height:1.68;color:var(--ink-soft)}
.panel li{margin-bottom:6px}
.panel p{font-size:13px;line-height:1.68;color:var(--ink-soft);margin:0 0 9px}
.panel.warn{border-color:var(--negative-bar)}
.jump{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px}

table.counts{border-collapse:collapse;font-size:12.5px;width:100%}
table.counts th,table.counts td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--inner-border);color:var(--ink-soft)}
table.counts th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);font-weight:500}
table.counts td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}

/* ── sticky footer ───────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--card-border);
  padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink-muted);z-index:20}
.bar kbd{background:var(--track);border:1px solid var(--inner-border);border-radius:5px;padding:1px 5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--ink-soft)}
.saved{margin-left:auto;font-variant-numeric:tabular-nums}
.saved.dirty{color:var(--accent)}
.hidefile{display:none}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="mark">€</div><h2>Audit questionnaire</h2></div>
    <div class="progwrap"><div class="progbar"><div id="sideBar"></div></div></div>
    <div class="progtext" id="sideText">0 / 0</div>

    <div class="label">Filter</div>
    <div class="filters">
      <label class="chk"><input type="checkbox" id="fUn"> Unanswered only</label>
      <label class="chk"><input type="checkbox" id="fMust"> MUST only</label>
      <label class="chk"><input type="checkbox" id="fStart"> Start-here ten</label>
      <label class="chk"><input type="checkbox" id="fThink"> Needs thought</label>
      <label class="chk"><input type="checkbox" id="fSkip" checked> Show auto-skipped</label>
    </div>

    <div class="label">Sections</div>
    <div id="nav"></div>

    <div class="label">Theme</div>
    <button class="btn" id="themeBtn" style="width:100%">Toggle light / dark</button>
  </aside>

  <main>
    <h1>Where we are, and where we are going</h1>
    <p class="sub">Session 6 of the Financieel audit &middot; 2026-09-14 &middot; <span id="hdrCount"></span> questions</p>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search questions, context, file paths…  ( / )">
      <button class="btn primary" id="btnExport">Export JSON</button>
      <button class="btn" id="btnCopy">Copy to clipboard</button>
      <button class="btn" id="btnImport">Import…</button>
      <input type="file" id="fileIn" accept="application/json,.json" class="hidefile">
    </div>

    <div class="progwrap">
      <div class="progbar"><div id="topBar"></div></div>
      <div class="progtext" id="topText"></div>
    </div>

    <div class="hairline"></div>

    <div id="intro"></div>
    <div id="list"></div>
    <div id="closing"></div>
  </main>
</div>

<div class="bar">
  <span><kbd>j</kbd>/<kbd>k</kbd> move</span>
  <span><kbd>1</kbd>–<kbd>9</kbd> toggle option</span>
  <span><kbd>Enter</kbd> write answer</span>
  <span><kbd>Esc</kbd> back out</span>
  <span><kbd>t</kbd> needs thought</span>
  <span><kbd>/</kbd> search</span>
  <span><kbd>e</kbd> export</span>
  <span class="saved" id="saved">not saved yet</span>
</div>

<script>
const DATA = {"questions":[{"id":"Q-001","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Distribution engine","priority":"MUST","context":"`src/lib/distributeIncome.js:17` — `isAutomated` is the only switch that enables the capped-wallet mechanic, and `isAutomated: true` appears at exactly one call site in the whole codebase, `src/pages/IncomeRecurringDetail.jsx:174`. Manual income (`src/pages/Income.jsx:1126`) and imported income (`src/pages/Import.jsx:823`) both pass `false`. So the entire capped subsystem is reachable only by pressing 'Log income' on a recurring income's detail page.","question":"Is 'caps apply only to recurring income logged from the recurring detail page' the intended product rule, or an artefact of where the flag happened to get wired?","why":"`CLAUDE.md` rule 7 describes the capped mechanic in detail without saying it has a single entry point. A reader meeting the word 'capped' would reasonably assume it applies wherever money lands in a capped wallet. If it should apply more widely, the change is one flag; if not, the docs should say so explicitly so nobody 'fixes' it later.","options":["(a) Intended and final — caps are a recurring-income concept only.","(b) Caps should also apply to imported credits routed into a capped wallet.","(c) Caps should apply on every income path, including manual entry."],"recommendation":"(a), plus one sentence in `CLAUDE.md` rule 7 naming the single entry point. The asymmetry is deliberate per the decision log, but its narrowness is currently invisible from the documentation.","skip":""},{"id":"Q-002","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Unallocated plans","priority":"SHOULD","context":"`src/lib/unallocatedPlans.js:44` — `firePlan` refuses to distribute at all if a plan's items do not fully allocate the computed amount. It logs and returns, moving nothing.","question":"When a plan under-allocates, should it stay silent, or surface to the user?","why":"A misconfigured plan (items summing to less than the trigger amount) silently never fires, and the user has no signal at all. This determines whether plan configuration needs validation, a UI surface, or both.","options":["(a) Keep it silent — treat it as a configuration error the user will notice from the balance.","(b) Surface it in the conflict banner as a 'plan could not fire' state.","(c) Validate at plan-save time so an under-allocating plan cannot be saved in the first place."],"recommendation":"(c) then (b). Prevention at save time is cheap and catches the common case; a silent refusal on real money is the kind of thing that gets discovered months later.","skip":""},{"id":"Q-003","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Unallocated plans","priority":"SHOULD","context":"`src/lib/unallocatedPlans.js:49` carries the comment `// HOOK: Stage 4e will log plan firings here.` No plan-firing log exists. An automatic distribution leaves transaction rows, but nothing records that a *plan* caused it rather than the user.","question":"Was the firing log dropped deliberately, or forgotten?","why":"It determines whether the Unallocated plan system needs an audit surface of its own, and whether the history tab the docs describe already covers it. It also affects Q-088: if a stall is invisible and a firing is invisible, the whole automatic layer is opaque.","options":["(a) Forgotten — build it.","(b) Deliberate — the transaction rows are enough; delete the comment.","(c) Build it only if plans turn out to move real money regularly."],"recommendation":"(b) if you can already tell a plan-driven credit from a manual one by its note text; otherwise (a). I could not find a marker in the written rows that distinguishes them.","skip":""},{"id":"Q-004","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Imports","priority":"NICE","context":"`src/lib/import/detectBank.js:8` — `ADAPTERS = [kbc]` registers only the PDF adapter. `banks/kbcCsv.js` is called directly from `buildCsvRows.js` and is never registered. The code comments explain why (the source is an explicit user toggle, and putting a CSV into a PDF registry risks misparsing), but the project docs describe 'two import sources' as if they share a routing layer.","question":"Should a second bank ever be supported, and if so does the CSV path get a registry too?","why":"It decides whether `detectBank` stays a one-adapter special case or becomes real infrastructure — which changes the cost of adding a second bank from 'write an adapter' to 'write an adapter and generalise the routing'.","options":["(a) KBC only, forever — keep the asymmetry, it is honest.","(b) Plan for a second bank, but generalise the registry when the second adapter actually arrives.","(c) Generalise the registry now."],"recommendation":"(b). Never generalise a registry from one example — the shape of the second adapter is what tells you what the abstraction should be.","skip":""},{"id":"Q-005","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Money rounding","priority":"NICE","context":"`src/lib/format.js` is deliberately display-only — its header and the decision log both say calculation and rounding stay out of it. The consequence is that the one-line helper `const round2 = n => Number(Number(n).toFixed(2))` is copy-pasted into nine places: `DistributionPopup.jsx:8`, `budgeting/DistributionEditor.jsx:17`, `budgetFlowLayout.js:9`, `budgetPlan.js:15`, `resolveDistribution.js:9`, `unallocatedPlans.js:4`, `Budgeting.jsx:16`, `WalletDetail.jsx:23`, and again as a `function` in `Income.jsx:35`.","question":"Is the nine-way duplication deliberate, or just never cleaned up?","why":"Money rounding is the single thing you would most want defined once. If the duplication is a deliberate consequence of keeping `format.js` pure-display, that reasoning should be in the decision log; if not, one shared pure module is a twenty-minute change fully covered by existing tests.","options":["(a) Deliberate — keeping `format.js` display-only is worth nine copies.","(b) Extract it to a new pure module (e.g. `src/lib/round.js`) and import it everywhere.","(c) Put it in `format.js` anyway, with an export name that makes the distinction clear."],"recommendation":"(b). It preserves the display/calculation separation the decision log cares about while removing the duplication, and it is the kind of change that is safe precisely because the callers are all tested.","skip":""},{"id":"Q-006","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Capped wallets","priority":"SHOULD","context":"`PROJECT-CONTEXT.md` §8 records that a capped wallet with a NULL `cap_max` treats its whole inflow as above the ceiling, because `Number(null)` is 0 — so a wallet with a custom `cap_reduction_rate` and no ceiling would silently reduce every credit. The UI now makes `cap_max` required (`WalletModal.jsx:74`) and a CHECK constraint backs it, but rows created before Phase A may still carry NULL.","question":"Should `resolveCappedInflow` defend against a missing `cap_max` rather than relying on the UI, and should any existing NULLs be backfilled?","why":"One line in a pure, tested, 28-line function versus a silent money bug on legacy rows. The note says all current capped rows are dummy data, but that has not been re-verified since July.","options":["(a) Add a guard in `resolveCappedInflow.js` treating a missing `cap_max` as 'no ceiling'.","(b) Backfill `cap_max` on any NULL rows via migration and leave the code alone.","(c) Neither — all such rows are dummy data and the risk is already gone."],"recommendation":"(a) and (b). The guard costs nothing and the live DB should be queried once for NULL `cap_max` on `budget_type = 'capped'` rows before this is closed either way.","skip":""},{"id":"Q-007","part":"A","section":"A1","sectionTitle":"Unexplained code","topic":"Settings","priority":"NICE","context":"`settings.strict_distribution` gates the Confirm button in `DistributionPopup` and is read at `Income.jsx:168`, `Import.jsx:163` and `WalletDetail.jsx:94`, each defaulting to `true` when the row is missing. The Budgeting page never reads it — there is no `strict_distribution` reference in `src/pages/Budgeting.jsx`.","question":"Should strict mode also constrain the Budgeting page's plan editing, or is it deliberately a per-income-log concept only?","why":"Budgeting writes the same `income_distribution_rules` rows the recurring log later consumes. If strict mode means 'a distribution must exactly exhaust the amount', the plan editor is the one place it is not enforced.","options":["(a) Deliberate — Budgeting has its own coverage model and does not need it.","(b) Apply it to Budgeting too.","(c) Drop strict mode as a setting entirely and always require exhaustion."],"recommendation":"(a). Budgeting's covered / short / over summary already tells the user the same thing in a better vocabulary, and it is plan-level across incomes rather than per-income, which strict mode cannot express.","skip":""},{"id":"Q-008","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Investment wallets","priority":"MUST","context":"`src/pages/WalletDetail.jsx:461-464` renders, for `wallet.type === 'investment'`, a card whose entire content is the sentence 'Investment wallet features coming in Phase 7.' The type is otherwise fully wired: creatable in `WalletModal.jsx:123`, a distribution target group in `DistributionPopup.jsx:16`, a free-pool wallet in `budgetPlan.js:24`, listed on `Wallets.jsx:67`, with its own icon in `walletIcons.js:29`.","question":"Finish investment wallets, remove the type, or make the placeholder honest?","why":"Money can already be distributed into an investment wallet, and its detail page then shows nothing about it — not even a balance or a transaction list. It is the only place in the app where a funded wallet has no view. It also decides whether 'Investment wallet type' stays on the parked list.","options":["(a) Finish it — decide what the page shows (value over time, contributions vs current value, manual valuation).","(b) Remove the type until it is actually wanted, migrating any existing wallets to variable.","(c) Keep it simple but honest — show the balance and transaction history like any other wallet, and drop the 'Phase 7' copy."],"recommendation":"(c) now, (a) later if you want it. A one-card fix removes a dead-end screen without committing to a phase. If (b), skip Q-074.","skip":""},{"id":"Q-009","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Imports","priority":"SHOULD","context":"`imported_statements` exists in the live DB with 0 rows and is written by nothing — `PROJECT-CONTEXT.md` §4 says so explicitly and warns not to 'fix' it by writing placeholder rows. It was created 2026-07-26 as scaffolding for a future classic-uittreksel (paper statement) adapter.","question":"Is a third import source still wanted?","why":"It decides whether the table stays as scaffolding, gets documented as speculative, or gets dropped — and whether the CSV adapter is the end of import work.","options":["(a) Yes, still wanted — keep the table.","(b) No — drop the table in a migration and record the decision.","(c) Undecided — keep it, but mark it in §4 as speculative scaffolding, not a planned feature."],"recommendation":"(c) until the first real CSV import has run (Q-010). The monthly CSV export may well make a third source unnecessary, and you will know within one import.","skip":""},{"id":"Q-010","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Imports","priority":"MUST","context":"`PROJECT-CONTEXT.md` §6.2 — the first real CSV import has never run. The schema is applied and verified, and the audit's live-DB pass on 2026-09-14 confirmed `recurring_import_links` and `monthly_balance_snapshots` both hold 0 rows. Roughly 200 of the project's 352 tests protect this pipeline.","question":"When will the first real import run, and should anything be built before it does?","why":"It is the single highest-information event available to the project: 15 modules and 200 tests are currently validated only against fixtures. It is also a hard input to Q-011, whose decision gets materially harder once rows exist.","options":["(a) Run it next, before any new feature work.","(b) Run it alongside the dashboard rebuild.","(c) Not a priority — the feature can wait for real need."],"recommendation":"(a). It is the cheapest way to find out whether the import subsystem is actually finished, and it is a prerequisite for answering Q-011 honestly.","skip":""},{"id":"Q-011","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Imports / schema","priority":"MUST","context":"`OPEN-QUESTIONS.md` Q3 — `transactions_import_fingerprint_idx` is non-unique, so cross-import duplicate detection is client-side only (`src/lib/import/dedupe.js`). A double-submit, or a second tab holding a stale fingerprint set, could insert the same bank transaction twice. With 0 imported rows today, a UNIQUE partial index could be added with nothing to conflict. The register flags this as 'the most consequential item in this file'.","question":"Promote the index to UNIQUE now, or accept client-side dedupe permanently?","why":"It is the cheapest this decision will ever be — after the first real import, adding a UNIQUE index means resolving existing duplicates first. But the fingerprint's shape may make uniqueness wrong rather than merely expensive.","options":["(a) Promote it to UNIQUE now, via the `db-migration` skill.","(b) Leave it non-unique — the client check is enough, and a UNIQUE index would reject a legitimate second identical transaction.","(c) Promote it, but widen the key so two genuinely identical same-day transactions can still both land."],"recommendation":"**This is the one place where I disagree with the recommendation already recorded in `OPEN-QUESTIONS.md`.** `fingerprintOf` (`src/lib/import/dedupe.js:16`) is `iban|date|amount|direction|counterpartyKey` — which is byte-identical for two €10,40 train tickets bought on the same day. The decision log explicitly argues those are real and must not default to skipped. A UNIQUE index would make them impossible to record at all. So (b), or (c) if you want DB enforcement — but (a) as written contradicts a decision already taken.","skip":""},{"id":"Q-012","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Dashboard","priority":"SHOULD","context":"`docs/dashboard-recon.md` §1 records that 'Needs attention' is rendered twice on the dashboard — a compact grouped card gated on `hasAlerts`, and a verbose always-on block — both reading the same `overdue` / `overspent` / `underfunded` arrays. The recon calls it 'pure redundancy; collapse to one'.","question":"Delete the duplicate now, or leave it for the dashboard rebuild?","why":"It is a roughly twenty-line deletion. Waiting means shipping a known redundancy for however long the rebuild takes, and the rebuild has been pending since July.","options":["(a) Delete the verbose block now, as a standalone fix.","(b) Leave it — the rebuild will remove it anyway.","(c) Delete the compact card instead and keep the verbose one."],"recommendation":"(b) if the rebuild is genuinely next (Q-070); (a) if it is more than a month away. Do not let it sit as 'the rebuild will handle it' indefinitely.","skip":""},{"id":"Q-013","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Dashboard","priority":"SHOULD","context":"`docs/dashboard-recon.md` §1 — the six-month outlook shows only `projectedNet` derived from the recurring schedule, ignores actual balances and spend entirely, computes `outlookMax` and never uses it, and its legend implies income/cost bars that are not drawn.","question":"Keep, fix, or cut the six-month outlook?","why":"It is the clearest example in the app of a widget that looks informative and is not. It also sets the precedent for how much forward projection the rebuilt dashboard should attempt.","options":["(a) Cut it.","(b) Keep the idea but base it on balances plus actuals, not the recurring schedule alone.","(c) Keep as-is, and fix only the misleading legend."],"recommendation":"(a) as part of the rebuild. A schedule-only projection duplicates what the 30-day chart already does better, and the 30-day chart at least starts from real balances.","skip":""},{"id":"Q-014","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Unbuilt phases","priority":"MUST","context":"`docs/plans/backup-restore-feature-plan.md` and `docs/plans/encryption-with-key-plan.md` were both written 2026-07-07 and have not been touched since. They are roadmap Phases B and C, and encryption is gated on backup. The backup plan's export list still names `budget_allocations`, a table the live DB confirms has 0 rows and no code reading it.","question":"Are backup/restore and client-side encryption still the intended direction, at the same priority?","why":"They are the two largest unbuilt items on the books. If either is out, the roadmap shortens dramatically and several other answers in this file change with it.","options":["(a) Both still wanted, in that order.","(b) Backup yes; encryption parked indefinitely.","(c) Neither — the app is personal, admin-visible data is acceptable.","(d) Encryption yes but scoped down (names and notes only, amounts and balances left plaintext)."],"recommendation":"(b) or (d). Backup has standalone value regardless of encryption. Encryption's documented cost — losing DB-side atomicity on the balance RPCs, which are this project's single hardest safety rule — is a heavy price for an app where you are both the user and the admin. Q-072 and Q-107 ask the same thing from the other end; answer whichever is easier.","skip":""},{"id":"Q-015","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Budgeting Phase C","priority":"MUST","context":"`OPEN-QUESTIONS.md` Q1 — Budgeting Phase C is roughly 1,300 lines on the never-pushed local branch `b/budgeting-performance`: `src/lib/budgetPerformance.js` (213 lines) with 268 lines of tests, four new components, a `budgeting-phase-C.md`, and edits to `DESIGN-SPEC.md` and `PROJECT-CONTEXT.md`. It is 6 commits behind `origin/main`, so landing it needs a rebase, not a push.","question":"Land it, or abandon it?","why":"It is the only unmerged work in the project and it blocks two other things: its `PROJECT-CONTEXT.md` edit will conflict with the §6 the audit just rewrote, and the page-split refactor is gated on it. It has been sitting since before 2026-07-30.","options":["(a) Rebase and land it as a PR.","(b) Abandon the branch and delete it.","(c) Cherry-pick only the pure lib plus its tests and drop the UI."],"recommendation":"(a) if the feature is still wanted — the code is written and tested, and it only rots from here. Expect to resolve `PROJECT-CONTEXT.md` by hand: take the audit's new §6 and re-add Phase C as a row in §6.1, rather than accepting the branch's version of the file.","skip":""},{"id":"Q-016","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Routing","priority":"NICE","context":"`src/App.jsx:96-109` nests a second `\u003cRoutes>` inside the authenticated shell with no catch-all. An unknown path renders the sidebar and an entirely empty content area — no 404, no redirect, no message.","question":"Should there be a NotFound route?","why":"A typo'd or stale bookmark currently produces a blank page with no explanation, which reads as 'the app is broken' rather than 'that page does not exist'. It is roughly five lines.","options":["(a) Add a `\u003cRoute path=\"*\">` that redirects to `/`.","(b) Add a real 404 page.","(c) Leave it — it is a private app."],"recommendation":"(a). Cheapest, and the right shape for a single-user tool where every real route is in the sidebar.","skip":""},{"id":"Q-017","part":"A","section":"A2","sectionTitle":"Half-built and abandoned","topic":"Course","priority":"NICE","context":"`Cursus/` is a 12-chapter course about this codebase (about 620 KB including a 402 KB PDF), last touched 2026-06-12. Its schema chapter is documented as outdated and four chapters cite a deleted `ARCHITECTURE.md`. `PROJECT-CONTEXT.md` §9 already describes it as 'a frozen teaching artefact'.","question":"Is the course still a live deliverable?","why":"It is a standing maintenance debt that every documentation pass has to route around. Deciding once that it is frozen stops it being re-raised.","options":["(a) Abandoned — mark it frozen once, never update it.","(b) Still live — schedule a schema-chapter refresh.","(c) Move it out of this repo entirely."],"recommendation":"(a). It is already effectively frozen and §9 says so; making it an explicit decision in §7 costs one line and closes the topic.","skip":""},{"id":"Q-018","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Money paths — atomicity","priority":"MUST","context":"Six of the ten code paths that move money are non-atomic client-orchestrated sequences (`docs/audit/UNDERSTANDING.md` §2.6). `src/lib/distributeIncome.js` fires one `increment_wallet_balance` RPC per row in a loop (`:19`, `:37`, `:45`, `:53`), inspects no result, and inserts the transaction rows only at the end (`:62`). If call 3 of 5 fails, wallets 1 and 2 are already credited and **no transaction row exists at all** — the balances have moved with nothing recording it. Every money path added since 2026-07-09 (`import_transactions`, `edit_income_distribution`, `distribute_from_unallocated`, `reset_user_data`) is a transactional RPC; the back-catalogue was never revisited.","question":"Should the older paths be brought up to the transactional standard, and if so in what order?","why":"This is the largest correctness gap in the project and the one an autonomous agent is most likely to make worse by tidying. It also needs new RPCs, which means the `db-migration` path and owner approval — so it must be planned, not slipped in.","options":["(a) Yes — write a `distribute_income` RPC mirroring `edit_income_distribution` and move the loop into the database.","(b) Yes but smaller — add error checking and a compensating write to the existing client loop.","(c) No — a single user on one device does not realistically hit these failure modes."],"recommendation":"(a), for `distributeIncome` first. It is the only path where a partial failure leaves balances changed with *no* record of the change — every other non-atomic path at least writes its transaction row alongside. Note this pulls in the opposite direction from client-side encryption (Q-072); decide that first if you can.","skip":""},{"id":"Q-019","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Money paths — reverse/reapply","priority":"SHOULD","context":"Five components perform a reverse-then-reapply with two sequential, unchecked RPC calls: `VariableTransactionForm.jsx:47-48`, `VariableTransactionList.jsx:35,39`, `VariableHistory.jsx:89-90`, `PaymentHistory.jsx:108-109`, `VariableOverview.jsx:66`. Neither call's result is inspected; if the second fails, the wallet keeps the credit from the first.","question":"Extract these into one shared helper, move them into an RPC, or leave them?","why":"They look like obvious duplication, which makes them a magnet for refactoring — and extracting them without adding error handling would propagate the bug into one place rather than fix it. That is precisely the kind of change an unsupervised agent would make.","options":["(a) One atomic `adjust_transaction_amount` RPC replacing all five.","(b) One shared client helper with proper error handling and rollback.","(c) Leave them, document the risk."],"recommendation":"(a). Same argument as Q-018, and it deletes roughly forty lines of duplicated client code. If (a), `CLAUDE.md` rule 1 is worth extending to say 'and transaction-amount edits reverse through an RPC, never through a client pair' (see Q-041).","skip":""},{"id":"Q-020","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Recurring rules","priority":"SHOULD","context":"`income_recurring` (income) and `recurring_rules` (expenses) are separate tables with near-identical semantics: both carry `start_date` / `end_date` / `parent_rule_id` version chains, both re-price by archive-and-successor, both feed `recurringUtils.generatePaymentDates`. They are edited by different code in different places (`Income.jsx` versus `RecurringRules.jsx`), and only the re-pricing write was ever extracted, into `src/lib/recurringAmountUpdate.js` — whose own header explains the duplication it did *not* resolve.","question":"Is the two-table split permanent, or worth unifying?","why":"It doubles the surface for every future change to recurrence — a new frequency, a pause feature, an end-date UI, a scheduler. Every such change has to be made twice, in two files, by two different code paths.","options":["(a) Permanent — income and expense recurrence genuinely differ (distribution rules hang off one and not the other).","(b) Unify into one table with a direction column.","(c) Keep the tables, but extract a shared recurrence module covering generation, versioning and editing."],"recommendation":"(a) with (c). Unifying the tables is a large migration for modest gain; unifying the *logic* is where the duplication actually costs you, and `recurringAmountUpdate.js` already proves the pattern works.","skip":""},{"id":"Q-021","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Recurring rules","priority":"SHOULD","context":"`recurring_rules.frequency` carries a CHECK limiting it to monthly / quarterly / yearly. `income_recurring.frequency` has no CHECK at all. `src/lib/recurringUtils.js` implements six frequencies including daily, weekly and custom, and has 10 tests covering all of them (`docs/dashboard-recon.md` §2d).","question":"Which is right — should the expense table accept weekly and daily, or should the income table gain a matching CHECK?","why":"Today the app can generate dates for frequencies one of its tables refuses to store. The import matcher's own reasoning in the decision log assumes weekly rules exist ('a weekly rule recognises several rows a month'), but a weekly expense cannot be created.","options":["(a) Widen the `recurring_rules` CHECK to match `recurringUtils`.","(b) Narrow `income_recurring` with a matching CHECK and drop the unused frequencies from `recurringUtils`.","(c) Leave it — nobody has needed a weekly rule."],"recommendation":"(a). The import matcher's comments already assume weekly rules are possible, and the date-generation code supporting them is written and tested.","skip":""},{"id":"Q-022","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Distribution storage","priority":"SHOULD","context":"`income_distribution_rules` stores `mode` plus `value` (the 'Option A' design in the decision log: euros resolved at apply time, so percentage rules scale to any amount) *and* a legacy `amount` euro column described as 'kept in sync during transition'. The transition never completed: `IncomeRecurringDetail.jsx:169` distributes from `dr.amount`, not by re-resolving `mode`/`value` against the amount actually being logged.","question":"Finish the transition, or formalise `amount` as authoritative?","why":"It is the direct cause of Q-023's bug, and it is the one place where the project's own stated storage model is not what the code reads. Either answer is fine; leaving both half-true is not.","options":["(a) Finish it — resolve `mode`/`value` at log time; keep `amount` written for display only.","(b) Keep `amount` authoritative and drop `mode`/`value` from the log path, documenting that percentage rules freeze at their last-saved euro value.","(c) Leave as-is."],"recommendation":"(a). It is the smaller change and it makes a percentage rule behave the way the user was told it behaves — which is the entire point of storing mode and value rather than euros.","skip":""},{"id":"Q-023","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Distribution desync","priority":"MUST","context":"`src/pages/IncomeRecurringDetail.jsx:404` renders an **editable** amount field, pre-filled from the rule. The `income_entries` row is inserted with whatever the user types (`:160`), but the distribution at `:169` maps `distributionRules` by `dr.amount` — the stored euro column — not by re-resolving against the amount just logged. Change the amount in that modal and the wallet credits no longer sum to the income entry. This is the same defect class as the one flagged in a comment at `Income.jsx:245-251`, reached from a different direction, and it is **not flagged anywhere**.","question":"Is this a real bug to fix, and should the amount field in the recurring log modal be editable at all?","why":"It silently desyncs an income from its distribution on the path the documentation calls 'automated'. It is also the only reachable entry point to the capped-wallet mechanic (Q-001), so the amounts it produces feed cap arithmetic and overflow routing.","options":["(a) Re-resolve `mode`/`value` against the typed amount (requires Q-022 option (a)).","(b) Make the field read-only — require re-pricing the rule to log a different amount.","(c) Keep it editable, but re-run the distribution popup whenever the typed amount differs from the rule's.","(d) Not a bug — the user is expected to fix the distribution afterwards."],"recommendation":"(c). It mirrors what the decision log already mandates for recurring income ('editing a recurring income's amount must force re-doing the distribution'), and unlike (a) it does not require the storage change first.","skip":""},{"id":"Q-024","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Budgeting writes","priority":"SHOULD","context":"`src/pages/Budgeting.jsx:85-98` rewrites an income's distribution by delete-all-then-reinsert. The comment says it throws on either error 'so callers can surface it and never leave an income half-written', but the two statements are not in a transaction: a failed insert after a successful delete leaves an income with **no** distribution — and a recurring income with no distribution cannot be logged at all.","question":"Wrap this in an RPC, or accept it?","why":"Same class as Q-018 and Q-019, but with a different failure mode: no money moves, the income simply becomes unusable until someone notices.","options":["(a) One `replace_income_distribution(p_income_id, p_rows jsonb)` RPC.","(b) Insert-then-delete ordering using a temporary priority offset.","(c) Accept it — the user can just save again."],"recommendation":"(a), bundled with whatever RPC work Q-018 produces. `IncomeRecurringDetail` does the same delete-then-reinsert, so one function serves both call sites.","skip":""},{"id":"Q-025","part":"A","section":"A3","sectionTitle":"Internal inconsistency","topic":"Import commit paths","priority":"NICE","context":"One imported file can produce writes through both an atomic path (`Import.jsx:398` → `import_transactions`) and a non-atomic one (`Import.jsx:823` → `distributeIncome`). This is deliberate and documented in the file's own header at `Import.jsx:11-17` ('commit paths, deliberately kept separate').","question":"Is that acceptable, or should imported income also commit transactionally?","why":"It means 'the import committed' is not a single guarantee. If Q-018 produces a `distribute_income` RPC, this closes for free without its own effort.","options":["(a) Fine as documented — they are different kinds of write.","(b) Close it when Q-018 is done, not before.","(c) Route imported income through `import_transactions` as well."],"recommendation":"(b). Not worth its own project, worth inheriting. (c) would mean reimplementing the whole distribution step inside the import RPC, which the header explicitly rejected.","skip":""},{"id":"Q-026","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Income amount-edit desync","priority":"MUST","context":"The only `KNOWN` marker in the entire codebase, at `src/pages/Income.jsx:245-251`: 'Editing the amount here updates only the income_entries row — it does NOT re-run distribution, so the wallet credits no longer sum to the new amount, leaving the income and its distribution desynced.' `PROJECT-CONTEXT.md` §6.3 carries it as 'STILL OPEN'. It has been open since the distribution redesign in July.","question":"Is this still real, does it still matter, and what priority?","why":"It produces silently wrong data rather than an error — the income says one number, the wallets say another, and nothing flags it. It is also the defect the audit found a second, unflagged instance of (Q-023).","options":["(a) Fix now — route amount changes through the distribution editor and its atomic `edit_income_distribution` RPC.","(b) Fix as part of the next Income-page work.","(c) Prevent instead — make the amount read-only once an income has credits.","(d) Not worth fixing."],"recommendation":"(c) as an immediate stopgap and (a) properly. (c) is a one-line guard that stops the data going wrong today; (a) is the real fix and shares work with Q-023.","skip":""},{"id":"Q-027","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Unhandled rejections","priority":"SHOULD","context":"`PROJECT-CONTEXT.md` §8 — '`DistributionPopup` calls `onConfirm` without `await` or `catch`. Any promise that rejects inside a caller's `onConfirm` becomes an unhandled rejection, and because the mandatory popups pass `onClose={null}` the user is left with no message and no way out.' The stated mitigation is that every caller must catch its own errors.","question":"Still real? Fix it centrally in the popup, or keep the 'every caller catches its own' contract?","why":"There are four call sites and every future one inherits the trap. A user stuck in an un-closable modal on a money action is the single worst failure mode in the app — worse than a failed write, because the user cannot tell what happened or get out.","options":["(a) Fix centrally — `await onConfirm(...)` inside the popup, with a catch that surfaces the error and keeps the modal open but closable.","(b) Keep the caller contract, and add it to the `code-reviewer` checklist.","(c) Both."],"recommendation":"(a). A contract that four independent callers must remember is a contract that will eventually be broken, and the popup is the one place the fix applies to all of them.","skip":""},{"id":"Q-028","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Non-idempotent re-pricing","priority":"SHOULD","context":"`PROJECT-CONTEXT.md` §8 — re-pricing a recurring rule is not idempotent: it archives the current version and inserts a successor, so running it twice for one rule leaves two active successors sharing a `parent_rule_id`, i.e. two live recurring rules. The stated mitigation is that any caller producing several updates for one rule must collapse them first. The function this lives in, `src/lib/recurringAmountUpdate.js`, has **zero tests**.","question":"Should the non-idempotence be fixed at the source rather than in every caller?","why":"The multi-month CSV import is exactly the caller that can produce several updates for one rule — and the function that must never run twice is the one with no test coverage at all.","options":["(a) Guard inside the function — refuse if the rule is already archived.","(b) Keep the caller contract and add the tests (`OPEN-QUESTIONS.md` Q5 / Q-042 below).","(c) Both."],"recommendation":"(c). The tests are needed regardless, and the guard is what makes the double-run case cheap to test.","skip":""},{"id":"Q-029","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Test-account data","priority":"NICE","context":"`OPEN-QUESTIONS.md` Q11 — a stale 'Test salary' €1000 income entry created 2026-07-10 while screenshotting `DistributionPopup`. The income row exists with no distribution, so every `db-verifier` run reports it as a violation. No balance impact. Outstanding since July.","question":"Delete it, give it a distribution, or teach `db-verifier` to ignore it?","why":"It is the only noise in an otherwise clean invariant check, and noise in a checker trains you to skim its output — which is how the next real violation gets missed.","options":["(a) Delete the row.","(b) Give it a distribution so it passes.","(c) Add an exclusion to the `db-verifier` agent."],"recommendation":"(a). It is one row on a test account. (c) is the worst option — it makes the checker permanently less trustworthy to save one delete.","skip":""},{"id":"Q-030","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Test-account data","priority":"SHOULD","context":"`docs/dashboard-recon.md` §4 — the test account is 'usable but thin': 4 active wallets, 1 recurring income, 1 recurring cost, 3 income entries, 4 transactions, all July 2026. The documented consequences: the 'Over time' charts are empty because `hasYearOfData` is false, no 'Needs attention' alerts fire, and no conflict banner appears. Three conditional widgets are never exercised in any screenshot or browser test.","question":"Should the test account be seeded with a fuller, deliberately varied dataset?","why":"Every visual verification and every future Playwright run is currently blind to the states that matter most — alerts, plan conflicts, a year of history, an over-cap wallet, an overdue payment. The dashboard rebuild in particular cannot be designed against data that never triggers its own alert paths.","options":["(a) Yes — build a repeatable seed script producing a realistic 14-month account.","(b) Yes, but by hand, once.","(c) No — verify those states with unit tests instead."],"recommendation":"(a). It is a prerequisite for the dashboard rebuild and it pays back on every screenshot thereafter. If you choose (a), also answer Q-120 — a seed script is a write, and it needs explicit permission to run unattended.","skip":""},{"id":"Q-031","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Dead columns","priority":"SHOULD","context":"Four columns exist in the live DB that nothing reads or writes: `wallets.cap_reduction_enabled` (documented dead, non-null on all 18 wallet rows), `settings.month_start_day` (removed by decision, column left), and `settings.currency` plus `settings.currency_symbol` (the currency picker was reverted in `c6e4f15`). The last two were invisible until the audit's live-DB pass found them (DISC-22) and were **not** documented as dead anywhere. The project convention, recorded in §7, is 'don't migrate dead columns away'.","question":"Keep the convention, or clean them up in one migration?","why":"The convention is sound, but the count is growing and one of the four was invisible from the repo entirely. The cost of a dead column is not the column — it is the next reader assuming a feature half-exists and wiring something to it.","options":["(a) Keep the convention, and make sure all four are documented as dead in §4.","(b) One cleanup migration dropping all four.","(c) Keep the convention, and add a rule: a dead column is documented in §4 the same day it dies."],"recommendation":"(c). It keeps the (correct) instinct to avoid pointless migrations while closing the failure mode that actually bit — an undocumented dead column that looked live.","skip":""},{"id":"Q-032","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Reset scope","priority":"SHOULD","context":"`OPEN-QUESTIONS.md` Q4 — `reset_user_data(p_full)` touches neither the 2026-07-26 import tables nor the 2026-07-30 CSV ones. A full reset removes `recurring_import_links` via FK cascade (because the rules go), but `monthly_balance_snapshots`, `counterparty_wallet_mappings` and `imported_statements` all **survive a full reset**.","question":"Should a full reset clear the import tables?","why":"The Settings danger-zone copy tells the user what is deleted, and today that copy is not the whole truth. It also determines whether 'start over' leaves stale counterparty-to-wallet learning and boundary snapshots pointing at data that no longer exists.","options":["(a) Yes, all three — a full reset means full.","(b) Snapshots and statements yes; keep `counterparty_wallet_mappings` (the learning is useful and harmless).","(c) Leave the function alone and fix the UI copy instead."],"recommendation":"(a). A 'Full reset' that leaves bank-derived data behind is exactly the kind of surprise the two-tier design was built to eliminate — the decision log's own reasoning for splitting the button was that its copy lied about what it kept.","skip":""},{"id":"Q-033","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Untested branching","priority":"SHOULD","context":"`docs/testing-notes.md` decision 3 — `evaluateUnallocatedPlans` is not unit-tested because it is query orchestration rather than pure euro logic; its multi-plan-stall branching is named as 'a candidate for a later integration test'. That branching is the logic deciding whether money moves automatically or stalls.","question":"Is the multi-plan stall worth a test, and where would it live?","why":"It is the highest-consequence untested branch in the project. `docs/audit/UNDERSTANDING.md` §8 makes the point directly: an agent optimising this would very plausibly 'fix' the more-than-one-eligible case by firing the first plan, which would silently move money the user never approved.","options":["(a) Yes — mock Supabase exactly as `unallocatedPlans.test.js` already does and test the branch directly.","(b) Yes, but as a real integration test against a test project.","(c) No — the guard is short enough to read and review."],"recommendation":"(a). The mocking pattern already exists in that same test file; this is hours, not a phase, and it turns a comment-enforced invariant into a test-enforced one.","skip":""},{"id":"Q-034","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Lint","priority":"SHOULD","context":"`OPEN-QUESTIONS.md` Q9 — `npm run lint` exits 1 with 44 problems (33 errors, 11 warnings) across 19 files, and has been red for at least a release cycle. The breakdown: `no-unused-vars` ×12, `react-hooks/static-components` ×11, `react-hooks/exhaustive-deps` ×11, `react-hooks/immutability` ×6, `react-hooks/set-state-in-effect` ×4. CI runs `npm test` only. The eleven `static-components` errors ('Cannot create components during render') are a genuine re-mount bug class, not a style nit.","question":"Fix to green, fix only the real-bug rules, or accept red permanently?","why":"A documented project command that fails trains everyone to ignore its output — including the PostToolUse hook that runs `eslint --fix` on every edit, which is doing less than it appears while the baseline is red.","options":["(a) Drive it to zero in one pass and add lint to CI.","(b) Fix only the 21 error-level problems that indicate real bugs (`static-components`, `immutability`, `set-state-in-effect`), and downgrade or ignore the rest.","(c) Accept the count as a baseline and keep lint out of CI permanently."],"recommendation":"(b), then add lint to CI at whatever count survives with `--max-warnings` pinned so it cannot regress. Going to zero means also chasing 12 `no-unused-vars` that change nothing, which is how this gets abandoned halfway.","skip":""},{"id":"Q-035","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Bundle size","priority":"NICE","context":"`npm run build` passes with one warning: the main chunk is 732 kB (190 kB gzipped) and the pdf.js worker 1.26 MB (`docs/audit/INVENTORY.md` §11). The `Import` route is already code-split via `React.lazy` (`src/App.jsx:102`); nothing else is.","question":"Does bundle size matter for this app?","why":"On a desktop-only personal tool used daily by one person, no — caching covers it. On a phone over mobile data, 190 kB gzipped before first paint is a real cost. This question is entirely downstream of Q-101.","options":["(a) No — ignore the warning permanently.","(b) Code-split the remaining heavy routes once mobile matters.","(c) Do it now."],"recommendation":"(a) until Q-101 says mobile matters, then (b). Answer Q-101 first.","skip":"Answer after Q-101. If Q-101 is (a), this is (a)."},{"id":"Q-036","part":"A","section":"A4","sectionTitle":"Known issues — confirm and prioritise","topic":"Dependencies","priority":"NICE","context":"After the 2026-09 cleanup removed four unused dependencies (taking the project's only critical advisory with them), `pdfjs-dist` — pinned at `6.1.200` — is the one genuinely-used direct dependency with an open advisory: high severity, fix available at `6.3.289`, a non-major bump (`PROJECT-CONTEXT.md` §8).","question":"Take the bump now?","why":"`src/lib/import/extractText.js` is the only consumer and it is documented as fragile — the `?url` worker import carries an explicit warning not to replace it, and the file has no tests. The upgrade is low risk but not zero risk.","options":["(a) Bump it, and verify by importing a real PDF (`test-fixtures/` holds four KBC-mobile extracts).","(b) Leave it pinned until the next import work.","(c) Bump and unpin to `^6`."],"recommendation":"(a). Keep the pin — the pin is why the worker wiring has not silently broken — but move it forward, since the fixtures make verification concrete rather than hopeful.","skip":""},{"id":"Q-037","part":"A","section":"A5","sectionTitle":"Rule violations","topic":"Design tokens","priority":"SHOULD","context":"`OPEN-QUESTIONS.md` Q8 / audit DISC-05 — `src/App.jsx` is the only file in `src/` still using raw Tailwind palette classes: `bg-gray-50 dark:bg-gray-950` and `text-gray-400` on the pre-session loading screen (`:71-72`), and `bg-green-500 text-white` on the signup welcome banner (`:84`). `CLAUDE.md` now records the exception explicitly, which means the rule and the code agree only because the rule was amended.","question":"Fix the four classes, or keep the amendment?","why":"These are the first two views a new user ever sees and both ignore the theme entirely. It is four lines of work.","options":["(a) Fix them — `bg-cream`, `text-ink-muted`, and the `positive` tokens for the banner.","(b) Keep the `CLAUDE.md` amendment blessing pre-session chrome as outside the token system.","(c) Leave both the code and the rule as they are."],"recommendation":"(a). It is the single cheapest item in this questionnaire and it closes a documented exception rather than institutionalising it.","skip":""},{"id":"Q-038","part":"A","section":"A5","sectionTitle":"Rule violations","topic":"Balance rule enforcement","priority":"MUST","context":"`CLAUDE.md` rule 1 (balances are never computed or written client-side) is honoured everywhere — but by convention only. All three `wallets` update sites (`Wallets.jsx:43`, `WalletDetail.jsx:280`, `Budgeting.jsx:139`) spread a payload built in `WalletModal.jsx:79-83`. Nothing — not a type, not a whitelist, not a DB trigger, not a lint rule — would stop a `balance` key from riding along if one ever entered that payload.","question":"Should the rule get a mechanism, and which one?","why":"It is the project's single hardest rule and its only enforcement is the `code-reviewer` agent plus your attention. An agent adding a field to `WalletModal` could breach it without touching any line that mentions the word `balance` — which is exactly the kind of violation a diff review misses.","options":["(a) An explicit column whitelist at the three update sites.","(b) A database trigger rejecting any direct UPDATE of `wallets.balance` outside the RPCs.","(c) A `design-check`-style grep in the hooks.","(d) Leave it to review."],"recommendation":"(a) now — five minutes, no migration — and (b) eventually. The trigger is the only enforcement that survives a future client rewrite, and it is worth noting that full client-side encryption (Q-072) would make this rule unenforceable by any mechanism at all, since balance math would have to move into the browser.","skip":""},{"id":"Q-039","part":"A","section":"A5","sectionTitle":"Rule violations","topic":"Charts","priority":"NICE","context":"`CLAUDE.md` and `DESIGN-SPEC.md` §6 forbid chart libraries; `src/` is fully compliant with seven components hand-rolling inline SVG and zero library imports. The `vite.config.js` `optimizeDeps` entry that named `recharts` (a package that was never installed) was removed in the 2026-09 cleanup.","question":"Is 'inline SVG only' still the rule you want as charts get more ambitious in the dashboard rebuild?","why":"`budgetFlowLayout.js` — 237 lines of tested pure geometry feeding a dumb renderer — shows the approach works and produces better-integrated, fully theme-aware charts. It also means every new chart type is hand-built.","options":["(a) Keep the rule — it has produced good results and total theme control.","(b) Relax it for complex chart types only, with a named library.","(c) Relax it entirely."],"recommendation":"(a). The one place a library would plausibly have helped — Sankey geometry — was solved better by a tested pure function than any library would have managed, and the result is unit-testable, which no library chart is.","skip":""},{"id":"Q-040","part":"A","section":"A5","sectionTitle":"Rule violations","topic":"Branch protection","priority":"NICE","context":"`CLAUDE.md` rule 4 — never push to `main`, always a `b/` branch plus a PR — with the note that 'branch protection is not enforced on the free plan, discipline is the protection'. `PROJECT-CONTEXT.md` §6.3 also carries an outstanding owner action from July: tick 'Require status checks to pass' on the `main` ruleset.","question":"Is the free-plan constraint permanent, and is the status-check requirement worth enabling to whatever degree the plan allows?","why":"The project has a documented incident where an unresolved merge reached `main` with conflict markers committed in 18 files. The PreToolUse guard blocks push-to-main from Claude Code; the gap is human pushes.","options":["(a) Enable whatever the free plan allows and keep the discipline.","(b) Pay for the plan that enforces it properly.","(c) Leave it as is."],"recommendation":"(a). It costs nothing and it closes the one path the guard hook cannot see.","skip":""},{"id":"Q-041","part":"A","section":"A5","sectionTitle":"Rule violations","topic":"Rule set currency","priority":"NICE","context":"The audit checked all seven `CLAUDE.md` non-negotiables against the code. All seven hold, with the single App.jsx exception in Q-037. But the list was written before the import subsystem, the Budgeting page and this audit existed.","question":"Are there rules you want **added** to `CLAUDE.md` as a result of this audit?","why":"Candidates the audit surfaced: 'transaction-amount edits reverse through an RPC, never a client pair' (Q-019); 'a dead column is documented in §4 the day it dies' (Q-031); 'money rounding uses the shared helper' (Q-005).","options":["(a) Add all three.","(b) Add only the RPC one.","(c) None — the list's value is that it is short."],"recommendation":"(b). The brevity of the list is load-bearing: seven rules get read, fifteen get skimmed. Only add a rule that prevents a money defect.","skip":""},{"id":"Q-042","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"recurringAmountUpdate","priority":"MUST","context":"`OPEN-QUESTIONS.md` Q5 — `src/lib/recurringAmountUpdate.js` (111 lines) writes to the database, re-versions recurring rules by archive-plus-successor, and carries an error-recovery path that restores the archived rule if the successor insert fails (and raises a specifically worded error if *that* also fails). Its own header calls it 'the ONE definition of that write'. It has **zero tests**. It is shared by the Income page and the CSV import's deviation flow.","question":"Is closing this the next piece of testing work, and does the error-recovery path need a test specifically?","why":"It is the largest coverage gap in the project weighted by risk — larger than any page. It is also where Q-028's non-idempotence lives, so the tests and the guard are naturally one piece of work.","options":["(a) Yes — mirror the `distributeIncome.test.js` mocking pattern and cover the happy path, the restore path, and a double run.","(b) Yes, but the happy path only.","(c) No — cover it when the import flow is exercised on real data (Q-010)."],"recommendation":"(a). The restore path only runs when something has already gone wrong, which is precisely when you want it to have been tested.","skip":""},{"id":"Q-043","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"Component tests","priority":"MUST","context":"`OPEN-QUESTIONS.md` Q6 — nothing under `src/pages/` or `src/components/` is tested; roughly 9,000 lines of JSX with zero coverage. `vitest.config.js` sets `include: ['src/**/*.test.js']` in the `node` environment, so a `.test.jsx` would not even be collected and React components cannot render. Adding coverage needs jsdom, `@testing-library/react`, and a change to that glob.","question":"Do you want component or page tests at all, and if so what triggers the investment?","why":"It gates the page-split refactor (Q-049) and it is the difference between 'the money logic is protected' and 'the app is protected'. It is also the prerequisite most often cited as a reason not to do something else.","options":["(a) Yes, now — set up jsdom plus testing-library and cover `DistributionPopup` first.","(b) Yes, but only as a prerequisite to the page split, not before.","(c) No — keep the suite pure and lean on browser verification.","(d) No component tests, but add Playwright smoke flows instead."],"recommendation":"(b) for the infrastructure, with (a)'s target when it happens. `DistributionPopup` is mounted by four pages in four modes with fifteen props — it is the one component where a test pays back fastest. If (c) or (d), Q-049 becomes 'leave them' by default.","skip":""},{"id":"Q-044","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"dashboardCalcs now-seam","priority":"SHOULD","context":"`OPEN-QUESTIONS.md` Q7 — `src/lib/dashboardCalcs.js` is 268 lines and 10 exports with **6 tests**, because `new Date()` is read internally at `:32`, `:76`, `:125` and `:163` with no injectable parameter. Compare `walletMetrics.js`: 67 lines, 3 exports, 12 tests, because it takes `now = new Date()`. The seam is already agreed — twice, in `docs/testing-notes.md` and in §7 — to be threaded during the dashboard rebuild rather than bolted on.","question":"Does that deferral still hold, or should the seam be threaded now?","why":"The deferral was recorded in July on the assumption the rebuild was imminent. If the rebuild slips again, this stays untested indefinitely — and threading the parameter is mechanical work that is completely independent of any redesign decision.","options":["(a) Hold the deferral — the rebuild will rework these functions anyway.","(b) Thread `now` now as a standalone change with tests, so the rebuild inherits a tested baseline.","(c) Thread it only through the four internal readers and leave the rest."],"recommendation":"(b), if the rebuild is more than a month away. A rebuild against tested functions is materially safer than one against untested functions, and the original rationale ('avoid churn on code that phase will rework') weakens every month the phase does not start.","skip":""},{"id":"Q-045","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"RPC testing","priority":"SHOULD","context":"The four database functions carrying the app's atomicity guarantees — `import_transactions`, `edit_income_distribution`, `reset_user_data`, `distribute_from_unallocated` — have no automated test. Each was verified once by hand against the live DB; nothing re-checks them. Testing them is awkward: `auth.uid()` is null when SQL runs through the connector, so a test must set `request.jwt.claims` in a DO block (`PROJECT-CONTEXT.md` §8).","question":"Should the RPCs get an automated test harness?","why":"They hold precisely the guarantees the client deliberately does not. If Q-018 moves more logic into RPCs, this gap grows with it. And if encryption ever moves that math into the browser, these tests are the migration's parity check.","options":["(a) Yes — pgTAP or a scripted SQL suite run against a Supabase branch.","(b) Yes but lighter — a `db-verifier`-style read-only invariant script run after every money-touching change.","(c) No — hand verification on change is enough at this scale."],"recommendation":"(b). It gets most of the value without a new toolchain, and the `db-verifier` agent already exists to run it. Note (a) is impossible unless Q-060 produces a baseline migration — you cannot create a test database from this repo today.","skip":""},{"id":"Q-046","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"Behaviour-test discipline","priority":"SHOULD","context":"`docs/testing-notes.md` and §7 both state that tests must be behaviour tests, not implementation tests, explicitly so they survive the encryption migration — 'the correct euro answer is the same whether the math runs in SQL or the browser'. All 352 tests hold that line, including the executor tests which aggregate mocked RPC calls into per-wallet euro totals rather than asserting call shape.","question":"If encryption is dropped or parked indefinitely (Q-072), does the behaviour-test discipline still earn its constraints?","why":"The discipline has a real cost: aggregating calls rather than asserting them makes some failures harder to localise. If its headline justification disappears, it is worth asking whether it is still the right trade rather than inheriting it unexamined.","options":["(a) Yes — it is good practice regardless and the reasoning stands on its own.","(b) Relax it where a targeted implementation test would diagnose a failure faster.","(c) It was only ever for encryption — revisit if encryption is out."],"recommendation":"(a). The aggregation pattern also survives the RPC-ification in Q-018, which is a far more likely future than encryption — the tests would keep passing unchanged as the loop moves into the database, which is exactly what you want.","skip":""},{"id":"Q-047","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"CI scope","priority":"NICE","context":"CI (`.github/workflows/test.yml`) runs on pull requests and pushes to `main`, and runs `npm test` only — not `npm run build`, not `npm run lint`. The build has caught real breakage in this project: the R2 reskin used it as the gate for broken JSX and undefined references.","question":"Add `npm run build` to CI?","why":"It is a three-second check that catches a class of error the test suite structurally cannot see — no test imports a `.jsx` file, so nothing in the suite would notice a broken component.","options":["(a) Yes, add build now.","(b) Add build and lint together once Q-034 settles.","(c) No."],"recommendation":"(a) immediately, independent of the lint decision. There is no argument for waiting — build already passes, so adding it cannot break anything.","skip":""},{"id":"Q-048","part":"A","section":"A6","sectionTitle":"Test coverage","topic":"pdf.js edge","priority":"NICE","context":"`src/lib/import/extractText.js` (64 lines) is the single impure module in the import pipeline and is documented as untestable in the node environment (pdf.js plus a `?url` worker import). `test-fixtures/` holds four real KBC-mobile `.txt` extracts and a 42-row CSV, but no PDF.","question":"Is it worth making the pdf.js edge testable — one committed anonymised PDF fixture and one test in a browser environment?","why":"It is the only place a `pdfjs-dist` upgrade (Q-036) could break silently, and text extraction is where a format change would first show up.","options":["(a) Yes — one PDF fixture plus one browser-mode Vitest test.","(b) No — verify manually after any pdf.js bump.","(c) No, and remove the ambition from the notes."],"recommendation":"(b). A second test environment for one function is a lot of machinery; a documented manual check tied to the version bump is proportionate, and Q-036's answer already creates that moment.","skip":""},{"id":"Q-049","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Oversized pages","priority":"SHOULD","context":"`docs/audit/STRUCTURE-REVIEW.md` found `src/` structurally sound and proposed no moves, but recorded one real finding: `Income.jsx` (1225 lines), `Import.jsx` (1194) and `WalletDetail.jsx` (989) are too large, and `WalletDetail.jsx` branches four distinct wallet behaviours in one component — fixed, variable, investment (`:461`) and unallocated (`:468`). Each of the three holds 21–28 `useState` hooks with sequenced DB writes. The split was deliberately not proposed, and is gated in §7 behind component tests and the unmerged Budgeting branch.","question":"Do you want these split, and if so in what order and behind what safety net?","why":"They are the three files an agent is most likely to damage and the most expensive to hold in context. But the project has a documented history of a merge that passed the build and still crashed the app at runtime, and none of these files has a single test.","options":["(a) Split `WalletDetail.jsx` first, by wallet type, once component tests exist.","(b) Split all three, in size order, once component tests exist.","(c) Extract only the modals and sub-views that are already self-contained, without the test prerequisite.","(d) Leave them."],"recommendation":"(a). `WalletDetail` is the only one where the split follows a seam that already exists visibly in the JSX. If Q-043 is (c) or (d), this becomes (d) by default — do not split untested 1,000-line files.","skip":"If Q-043 is (c) or (d), this is (d)."},{"id":"Q-050","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"src/ structure","priority":"NICE","context":"`docs/audit/STRUCTURE-REVIEW.md` verified rather than assumed: `lib/` never imports upward from `components/` or `pages/`, `components/` never imports from `pages/`, there are no circular imports across the 31 non-test lib modules, and a `hooks/` directory would hold two one-line `useContext` wrappers. 32 of 96 tracked `src/` files import from `lib/` and 9 from `components/`, so renaming either rewrites imports in at least 41 files.","question":"Confirm you are happy leaving `src/` alone — or is there something specific that annoys you when working in it?","why":"I found no problem worth a 41-file diff, but I am reading the code, not living in it. A concrete annoyance from you beats my analysis.","options":["(a) Leave it — nothing annoys me.","(b) Something specific does, and I will name it.","(c) I want feature folders anyway."],"recommendation":"(a), unless you can name a symptom. 'Cleaner' is not worth a whole-codebase diff in a project with this merge history — and the audit could not find a symptom to name on your behalf.","skip":""},{"id":"Q-051","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Hand-rolled choices","priority":"NICE","context":"The project deliberately hand-rolls three things a library would normally do: the money formatter (`src/lib/format.js`, 47 lines — `Intl` emits a non-breaking space and varies by ICU version, making the spec string non-deterministic), the CSV tokenizer (`src/lib/import/csv.js`, 72 lines — the real export has zero quoted fields, so papaparse would have bought a `split(';')`), and every chart (inline SVG). All three have explicit reasoning in §7.","question":"Do any of them still feel like the wrong call in hindsight?","why":"I read the reasoning and agree with all three, so I am asking rather than proposing. Hand-rolled code you regret is a different problem from hand-rolled code you chose, and only you know which this is.","options":["(a) All three still right.","(b) One of them was a mistake — I will say which.","(c) Revisit if a fourth one appears."],"recommendation":"(a). Each decision names a concrete failure the library would have caused rather than a general preference, which is the strongest form of this argument and the rarest.","skip":""},{"id":"Q-052","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"Formatter","priority":"SHOULD","context":"§7 records that 'a dedicated formatter (Prettier) is a candidate for the testing phase'. The testing phase shipped without it. The PostToolUse hook runs `eslint --fix` on edited `.js`/`.jsx` files, non-blocking.","question":"Add Prettier?","why":"With one maintainer and an auto-fix hook already running, formatting drift is not currently a visible problem — but an `eslint --fix` hook on a codebase whose lint baseline is red is doing less than it appears.","options":["(a) Yes — it removes a class of diff noise permanently.","(b) No — the hook is enough.","(c) Yes, but only after Q-034 gets lint to a known state."],"recommendation":"(c). Adding a formatter to a codebase with 33 lint errors reformats everything at once and buries the real errors inside a whole-repo diff — the exact situation `verify-merge` exists to warn about.","skip":""},{"id":"Q-053","part":"A","section":"A7","sectionTitle":"My suggestions","topic":"DB access friction","priority":"SHOULD","context":"The Supabase MCP needs OAuth authorization each session, and a long-running session caches a dead `client_id` in memory — the fix is restarting Claude Code, which `CLAUDE.md` now documents after the audit hit it. Two of this operation's six sessions were partly blocked on it. The `db-verifier` agent depends on it and is the project's onl
